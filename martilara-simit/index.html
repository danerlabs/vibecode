<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1026">
<title>Martılara Simit At</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1026; }
  canvas {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

/* =========================================================
   AYARLAR
   ========================================================= */

const VW = 540, VH = 960;           // dikey mantıksal ekran (9:16)
const ROUND = 60;                    // tur süresi (sn)
const GRAVITY = 900;                 // px/sn²
const MAX_SPEED = 1350;              // en güçlü atış
const PULL_K = 5;                    // geri çekme → hız çarpanı
const MIN_PULL = 18;
const HAND = { x: 270, y: 868 };     // simidin elden çıktığı nokta
const BASKET = { x: 455, y: 905 };   // simit sepeti (hırsız martının hedefi)
const STOCK_MAX = 8;                 // sepetteki en fazla simit
const REFILL = 1.5;                  // her kaç saniyede bir simit gelir
const CATCH_R = 24;                  // martının simidi kapma yarıçapı
const HOMING_R = 80;                 // martı yakındaki simide doğru yönelir
const HOMING_SPEED = 50;
const HORIZON = 520, DECK_Y = 860;
const PASSENGER_HEAD_Y = 792;

const LINES_FED = ['Mmm, susamlı!', 'Sağ ol hemşerim!', 'Çay da var mı?', 'Bir tane daha!',
  'Kaşar da olsaydı!', 'Oh be!', 'Simit dediğin böyle!', 'Taze mi bu?', 'Eline sağlık!', 'Yaşasın vapur!'];
const LINES_THIEF = ['Bu benim artık!', 'Hehe, sağ ol!', 'Kim bakıyor ki?', 'Sepet benim!'];
const LINES_THIEF_HIT = ['Tamam tamam gidiyorum!', 'Aa, yakalandım!', 'Bir daha yapmam!'];
const LINES_HUNGRY = ['Bana da bir simit!', 'Abi bana da!', 'Açlıktan bayılacağım!', 'Bir simit de buraya!'];
const LINES_FEDP = ['Afiyet olsun bana!', 'Eline sağlık!', 'Çayım da olsaydı!', 'Tam isabet!'];
const LINES_HIT = ['Kardeşim dikkat!', 'Hop! Kafama!', 'Gözümü çıkaracaktın!', 'Martıya at, bana değil!'];
const LINES_GOLD = ['Altın martı!', 'Parıl parıl!'];

/* =========================================================
   YARDIMCILAR
   ========================================================= */

const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = n => Math.round(n).toLocaleString('tr-TR');
function store(k, v) {
  try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; }
}

/* =========================================================
   SES (yalnızca WebAudio ile üretilir)
   ========================================================= */

const Sound = {
  ac: null, master: null, muted: store('simit_mute') === '1', noiseBuf: null, waves: null,

  init() {
    if (!this.ac) {
      try {
        this.ac = new (window.AudioContext || window.webkitAudioContext)();
        this.master = this.ac.createGain();
        this.master.gain.value = this.muted ? 0 : 1;
        this.master.connect(this.ac.destination);
        const len = this.ac.sampleRate * 2;
        this.noiseBuf = this.ac.createBuffer(1, len, this.ac.sampleRate);
        const d = this.noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        this.startWaves();
      } catch (e) { this.ac = null; }
    }
    if (this.ac && this.ac.state === 'suspended') this.ac.resume();
  },
  toggle() {
    this.muted = !this.muted;
    store('simit_mute', this.muted ? '1' : '0');
    if (this.master) this.master.gain.value = this.muted ? 0 : 1;
  },
  env(g, t0, a, peak, rel) {
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + rel);
  },
  osc(type, f1, f2, dur, vol, delay) {
    if (!this.ac) return;
    const t0 = this.ac.currentTime + (delay || 0);
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + dur);
    this.env(g, t0, 0.01, vol, dur);
    o.connect(g).connect(this.master); o.start(t0); o.stop(t0 + dur + 0.05);
  },
  noise(f1, f2, dur, vol, q) {
    if (!this.ac) return;
    const t0 = this.ac.currentTime;
    const s = this.ac.createBufferSource(); s.buffer = this.noiseBuf;
    const f = this.ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = q || 1.5;
    f.frequency.setValueAtTime(f1, t0); f.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    const g = this.ac.createGain(); this.env(g, t0, 0.02, vol, dur);
    s.connect(f).connect(g).connect(this.master); s.start(t0); s.stop(t0 + dur + 0.05);
  },
  // Martı çığlığı: titreşimli, aşağı kayan "kiyaa"
  gull(vol) {
    if (!this.ac) return;
    const n = 1 + Math.floor(Math.random() * 3), base = rand(1300, 1900);
    for (let k = 0; k < n; k++) {
      const t0 = this.ac.currentTime + k * rand(0.22, 0.3);
      const o = this.ac.createOscillator(), lfo = this.ac.createOscillator(), lg = this.ac.createGain();
      const f = this.ac.createBiquadFilter(), g = this.ac.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(base * 1.15, t0);
      o.frequency.exponentialRampToValueAtTime(base * 0.6, t0 + 0.24);
      lfo.frequency.value = 28; lg.gain.value = 70; lfo.connect(lg).connect(o.frequency);
      f.type = 'bandpass'; f.frequency.value = 1900; f.Q.value = 4;
      this.env(g, t0, 0.03, vol || 0.05, 0.24);
      o.connect(f).connect(g).connect(this.master);
      o.start(t0); lfo.start(t0); o.stop(t0 + 0.32); lfo.stop(t0 + 0.32);
    }
  },
  // Vapur düdüğü
  horn() {
    if (!this.ac) return;
    const t0 = this.ac.currentTime;
    const f = this.ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 520;
    const g = this.ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.16, t0 + 0.2);
    g.gain.setValueAtTime(0.16, t0 + 1.4);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.0);
    [98, 147, 196.5].forEach(fr => {
      const o = this.ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = fr;
      o.connect(f); o.start(t0); o.stop(t0 + 2.1);
    });
    f.connect(g).connect(this.master);
  },
  // Hafif dalga uğultusu
  startWaves() {
    const s = this.ac.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    const f = this.ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420;
    const g = this.ac.createGain(); g.gain.value = 0.025;
    const lfo = this.ac.createOscillator(), lg = this.ac.createGain();
    lfo.frequency.value = 0.15; lg.gain.value = 0.018; lfo.connect(lg).connect(g.gain);
    s.connect(f).connect(g).connect(this.master); s.start(); lfo.start();
  },
  throw()  { this.noise(500, 2400, 0.2, 0.25, 1.2); },
  catch(c) { this.osc('sine', 600, 1200, 0.09, 0.2); this.osc('triangle', 900 + c * 60, 1600 + c * 80, 0.1, 0.12, 0.07); },
  gold()   { [0, 1, 2, 3, 4].forEach(k => this.osc('sine', 880 * Math.pow(1.19, k), 900 * Math.pow(1.19, k), 0.12, 0.1, k * 0.06)); },
  bonk()   { this.osc('square', 220, 80, 0.18, 0.12); },
  thud()   { this.noise(300, 120, 0.12, 0.2, 0.8); },
  steal()  { this.osc('triangle', 900, 250, 0.35, 0.15); },
  yum()    { [0, 1, 2].forEach(k => this.osc('sine', 520 * Math.pow(1.26, k), 540 * Math.pow(1.26, k), 0.1, 0.12, k * 0.08)); },
};

/* =========================================================
   OYUN DURUMU
   ========================================================= */

// mode: 'start' | 'play' | 'pause' | 'end'
let G = null;

function newGame() {
  G = {
    mode: 'start', t: 0, score: 0, fed: 0, combo: 0, bestCombo: 0, thrown: 0, hitsOnPeople: 0,
    stock: STOCK_MAX, refill: 0, handCooldown: 0,
    gulls: [], simits: [], crumbs: [], floats: [], bubbles: [], splashes: [],
    spawnTimer: 0.5, goldTimer: rand(12, 20), thiefTimer: rand(9, 14), hungryTimer: rand(6, 10),
    cryTimer: 2, hornTimer: rand(14, 22), shake: 0, endAt: 0,
    passengers: [
      { x: 72,  col: '#c0392b', hair: '#3e2723', hat: false, hungry: 0, hit: 0, eat: 0 },
      { x: 168, col: '#2e86c1', hair: '#212121', hat: true,  hungry: 0, hit: 0, eat: 0 },
      { x: 372, col: '#8e44ad', hair: '#795548', hat: false, hungry: 0, hit: 0, eat: 0 },
      { x: 478, col: '#16a085', hair: '#bdbdbd', hat: true,  hungry: 0, hit: 0, eat: 0 },
    ],
    drag: null,
  };
}

/* =========================================================
   SİMÜLASYON
   ========================================================= */

function step(dt) {
  if (G.mode !== 'play') return;
  G.t += dt;

  // Simit stoğu yavaşça dolar
  if (G.stock < STOCK_MAX) {
    G.refill += dt;
    if (G.refill >= REFILL) { G.refill = 0; G.stock++; }
  } else G.refill = 0;
  G.handCooldown = Math.max(0, G.handCooldown - dt);

  spawnGulls(dt);
  G.gulls.forEach(g => updateGull(g, dt));
  G.gulls = G.gulls.filter(g => !g.gone);
  G.simits.forEach(s => updateSimit(s, dt));
  G.simits = G.simits.filter(s => !s.gone);
  updatePassengers(dt);

  // Ortam sesleri
  G.cryTimer -= dt;
  if (G.cryTimer <= 0) { G.cryTimer = rand(2.5, 6); Sound.gull(0.035); }
  G.hornTimer -= dt;
  if (G.hornTimer <= 0) { G.hornTimer = rand(18, 26); Sound.horn(); }

  updateEffects(dt);
  if (G.t >= ROUND) endGame();
}

function spawnGulls(dt) {
  const normal = G.gulls.filter(g => g.kind === 'normal' && g.state === 'fly').length;
  const want = G.t < 20 ? 3 : G.t < 40 ? 4 : 5;
  G.spawnTimer -= dt;
  if (G.spawnTimer <= 0 && normal < want) {
    G.spawnTimer = rand(0.6, 1.4);
    addGull('normal');
  }
  G.goldTimer -= dt;
  if (G.goldTimer <= 0) {
    G.goldTimer = rand(14, 22);
    addGull('gold');
    addFloat(VW / 2, 200, pick(LINES_GOLD), '#ffd54f', 30);
    Sound.gold();
  }
  G.thiefTimer -= dt;
  if (G.thiefTimer <= 0 && G.t < ROUND - 4) {
    G.thiefTimer = rand(10, 15);
    addGull('thief');
  }
}

function addGull(kind) {
  const fromLeft = Math.random() < 0.5;
  const speed = kind === 'gold' ? rand(190, 230) : rand(85, 155) + G.t * 0.9;
  const g = {
    kind, state: 'fly', x: fromLeft ? -40 : VW + 40, y: 0,
    vx: (fromLeft ? 1 : -1) * speed, vy: 0,
    baseY: kind === 'gold' ? rand(130, 300) : rand(110, 450),
    amp: rand(10, 35), freq: rand(1, 2.2), phase: rand(0, 6), flap: rand(0, 6),
    flapSpeed: kind === 'gold' ? 16 : rand(9, 13), size: kind === 'gold' ? 1.15 : rand(0.9, 1.1),
    life: 0, carrying: false,
  };
  if (kind === 'thief') {
    g.baseY = rand(160, 260);
    g.vx = (fromLeft ? 1 : -1) * 130;
    g.state = 'cruise';
    g.diveAt = rand(1.2, 2.2);
  }
  g.y = g.baseY;
  G.gulls.push(g);
}

function updateGull(g, dt) {
  g.life += dt;
  g.flap += g.flapSpeed * dt;
  if (g.state === 'fly') {
    g.x += g.vx * dt;
    g.baseY += g.vy * dt;
    g.vy *= Math.pow(0.3, dt);
    g.y = g.baseY + Math.sin(g.life * g.freq + g.phase) * g.amp;
    // Yakındaki simide doğru meyletme
    for (const s of G.simits) {
      const dx = s.x - g.x, dy = s.y - g.y, d = Math.hypot(dx, dy);
      if (d < HOMING_R && d > 1) {
        g.x += dx / d * HOMING_SPEED * dt;
        g.baseY += dy / d * HOMING_SPEED * dt;
      }
    }
    if ((g.vx > 0 && g.x > VW + 60) || (g.vx < 0 && g.x < -60)) g.gone = true;
  } else if (g.state === 'cruise') {     // hırsız: önce gezinir, sonra sepete dalar
    g.x += g.vx * dt;
    g.y = g.baseY + Math.sin(g.life * 3) * 10;
    if (g.life > g.diveAt && g.x > 60 && g.x < VW - 60) {
      g.state = 'dive';
      addBubble(g.x, g.y - 30, pick(LINES_THIEF), '#fff3e0');
      Sound.gull(0.07);
    }
    if ((g.vx > 0 && g.x > VW + 60) || (g.vx < 0 && g.x < -60)) g.gone = true;
  } else if (g.state === 'dive') {
    const dx = BASKET.x - g.x, dy = BASKET.y - 30 - g.y, d = Math.hypot(dx, dy);
    const sp = 210;
    g.vx = dx / d * sp; g.x += g.vx * dt; g.y += dy / d * sp * dt;
    if (d < 20) {
      if (G.stock > 0) {
        G.stock--;
        g.carrying = true;
        addFloat(BASKET.x - 40, BASKET.y - 70, 'Simidini çaldı! -1', '#ff8a80', 22);
        addBubble(g.x, g.y - 40, pick(LINES_THIEF), '#fff3e0');
        Sound.steal();
        G.shake = 6;
      }
      g.state = 'leave'; g.vx = (g.x < VW / 2 ? -1 : 1) * 220; g.vy = -260;
    }
  } else if (g.state === 'leave' || g.state === 'fed' || g.state === 'flee') {
    g.x += g.vx * dt; g.y += g.vy * dt;
    if (g.y < -80 || g.x < -80 || g.x > VW + 80) g.gone = true;
  }
}

// Simit uçuşu ve çarpışmalar
function updateSimit(s, dt) {
  s.vy += GRAVITY * dt;
  s.x += s.vx * dt; s.y += s.vy * dt;
  s.rot += s.spin * dt;
  s.age += dt;
  if (Math.random() < 0.3) G.crumbs.push(crumb(s.x, s.y, 0.4)); // susam izi

  // Martılar
  for (const g of G.gulls) {
    if (g.state === 'leave' || g.state === 'fed' || g.state === 'flee') continue;
    const r = CATCH_R * g.size;
    if (Math.hypot(s.x - g.x, s.y - g.y) < r) {
      s.gone = true;
      if (g.kind === 'thief') hitThief(g);
      else feedGull(g);
      return;
    }
  }

  // Yolcular (yalnızca düşerken)
  if (s.vy > 0 && s.y >= PASSENGER_HEAD_Y && s.y < DECK_Y + 20) {
    for (const p of G.passengers) {
      if (Math.abs(s.x - p.x) < 26) { s.gone = true; landOnPassenger(p, s); return; }
    }
  }
  // Güverteye düştü ya da ekrandan çıktı → kaçtı
  if (s.vy > 0 && s.y >= DECK_Y + 40) {
    s.gone = true; miss();
    for (let k = 0; k < 10; k++) G.crumbs.push(crumb(s.x, s.y, 1));
    Sound.thud();
    if (Math.random() < 0.3) addBubble(nearestPassenger(s.x).x, PASSENGER_HEAD_Y - 40, pick(['Simit israf olmasın!', 'Yazık oldu simide!', 'Martıya at martıya!']));
  } else if (s.x < -40 || s.x > VW + 40) {
    s.gone = true; miss();
  }
}

function feedGull(g) {
  G.combo++;
  G.bestCombo = Math.max(G.bestCombo, G.combo);
  G.fed++;
  const mult = Math.min(G.combo, 10);
  const pts = (g.kind === 'gold' ? 50 : 10) * mult;
  G.score += pts;
  g.state = 'fed'; g.carrying = true;
  g.vx = (g.vx >= 0 ? 1 : -1) * rand(160, 220); g.vy = rand(-200, -120);
  g.flapSpeed = 20;
  const label = '+' + pts + (G.combo > 1 ? '  x' + G.combo : '');
  addFloat(g.x, g.y - 30, label, g.kind === 'gold' ? '#ffd54f' : '#ffffff', g.kind === 'gold' ? 34 : 24 + Math.min(G.combo, 6) * 2);
  if (G.combo >= 3 && G.combo % 3 === 0) addFloat(VW / 2, 330, G.combo + ' KOMBO!', '#ffeb3b', 44);
  if (Math.random() < 0.45 || g.kind === 'gold') addBubble(g.x, g.y - 34, pick(LINES_FED));
  for (let k = 0; k < (g.kind === 'gold' ? 26 : 14); k++) G.crumbs.push(crumb(g.x, g.y, 1, g.kind === 'gold'));
  if (g.kind === 'gold') { Sound.gold(); G.shake = 6; } else Sound.catch(G.combo);
  if (Math.random() < 0.5) Sound.gull(0.05);
}

function hitThief(g) {
  G.score += 20;
  g.state = 'flee'; g.vx = (g.x < VW / 2 ? -1 : 1) * 260; g.vy = -300; g.flapSpeed = 22;
  addFloat(g.x, g.y - 30, 'Hırsızı kovaladın! +20', '#b9f6ca', 22);
  addBubble(g.x, g.y - 40, pick(LINES_THIEF_HIT), '#fff3e0');
  for (let k = 0; k < 12; k++) G.crumbs.push(crumb(g.x, g.y, 1));
  Sound.catch(1); Sound.gull(0.06);
}

function landOnPassenger(p, s) {
  for (let k = 0; k < 12; k++) G.crumbs.push(crumb(s.x, s.y, 1));
  if (p.hungry > 0) {
    p.hungry = 0; p.eat = 1.5;
    G.score += 40;
    addFloat(p.x, PASSENGER_HEAD_Y - 60, 'Afiyet olsun! +40', '#b9f6ca', 24);
    addBubble(p.x, PASSENGER_HEAD_Y - 30, pick(LINES_FEDP));
    Sound.yum();
  } else {
    p.hit = 0.8;
    G.combo = 0;
    G.hitsOnPeople++;
    G.score = Math.max(0, G.score - 15);
    G.shake = 8;
    addFloat(p.x, PASSENGER_HEAD_Y - 60, '-15', '#ff5252', 26);
    addBubble(p.x, PASSENGER_HEAD_Y - 30, pick(LINES_HIT), '#ffebee', true);
    Sound.bonk();
  }
}

function miss() { G.combo = 0; }

function nearestPassenger(x) {
  return G.passengers.reduce((a, b) => (Math.abs(b.x - x) < Math.abs(a.x - x) ? b : a));
}

function updatePassengers(dt) {
  G.passengers.forEach(p => {
    p.hit = Math.max(0, p.hit - dt);
    p.eat = Math.max(0, p.eat - dt);
    if (p.hungry > 0) {
      p.hungry -= dt;
      if (p.hungry <= 0) addBubble(p.x, PASSENGER_HEAD_Y - 30, pick(['Neyse, kalsın...', 'Bana yok galiba!']));
    }
  });
  G.hungryTimer -= dt;
  if (G.hungryTimer <= 0) {
    G.hungryTimer = rand(9, 14);
    const free = G.passengers.filter(p => p.hungry <= 0 && p.eat <= 0);
    if (free.length && G.t < ROUND - 3) {
      const p = pick(free);
      p.hungry = 6;
      addBubble(p.x, PASSENGER_HEAD_Y - 30, pick(LINES_HUNGRY), '#fffde7', true, 4.5);
    }
  }
}

/* ---------- Atış ---------- */

function throwSimit(vx, vy) {
  if (G.mode !== 'play' || G.stock <= 0) return false;
  const sp = Math.hypot(vx, vy);
  if (sp > MAX_SPEED) { vx *= MAX_SPEED / sp; vy *= MAX_SPEED / sp; }
  G.stock--; G.thrown++;
  G.handCooldown = 0.22;
  G.simits.push({ x: HAND.x, y: HAND.y - 6, vx, vy, rot: 0, spin: rand(8, 14) * (vx < 0 ? -1 : 1), age: 0 });
  Sound.throw();
  return true;
}

// Elden ekranın görünen alt kenarına kadar olan mesafe (mantıksal piksel).
function roomBelowHand(w, h) {
  const s = Math.min(w / VW, h / VH);
  const oy = (h - VH * s) / 2;
  return (h - oy) / s - HAND.y;
}
// 390×844 portrede tam aşağı çekiş. Masaüstünde oyun yüksekliğe sığar,
// el neredeyse alt kenardadır; aynı jest çok kısa kalır. Çarpan o jesti
// bu çekişe uzatır. Telefon bu ölçüde olduğundan çarpan 1'dir, hissi değişmez.
const REF_PULL = roomBelowHand(390, 844);

function pullScale() {
  const w = view.w || 1, h = view.h || 1;
  // Telefonda oyun genişliğe sığar; alttaki boşluk çekişi zaten uzatır.
  // Yalnızca yüksekliğe sığan görünümde (masaüstü) aynı jesti telefona eşitle.
  if (h / VH > w / VW) return 1;
  const room = roomBelowHand(w, h);
  if (!(room > 1) || room >= REF_PULL) return 1;
  return REF_PULL / room;
}

function dragVelocity(d) {
  const scale = pullScale();
  const dx = (d.x0 - d.x) * scale, dy = (d.y0 - d.y) * scale;
  let vx = dx * PULL_K, vy = dy * PULL_K;
  const sp = Math.hypot(vx, vy);
  if (sp > MAX_SPEED) { vx *= MAX_SPEED / sp; vy *= MAX_SPEED / sp; }
  return { vx, vy, pull: Math.hypot(dx, dy) };
}

/* ---------- Efektler ---------- */

function crumb(x, y, power, gold) {
  return {
    x, y, vx: rand(-120, 120) * power, vy: rand(-160, 40) * power, life: rand(0.4, 0.9),
    col: gold ? pick(['#ffd54f', '#fff59d', '#ffecb3']) : pick(['#c68642', '#a0522d', '#fff8e1', '#f5deb3']),
    r: rand(1.2, 3),
  };
}
function addFloat(x, y, text, col, size) { G.floats.push({ x, y, text, col, size: size || 22, life: 1.3 }); }
function addBubble(x, y, text, bg, force, life) {
  if (!force && G.bubbles.length >= 3) return;
  G.bubbles.push({ x, y, text, bg: bg || '#ffffff', life: life || 2, max: life || 2 });
}
function updateEffects(dt) {
  G.crumbs.forEach(c => { c.life -= dt; c.x += c.vx * dt; c.y += c.vy * dt; c.vy += 500 * dt; });
  G.crumbs = G.crumbs.filter(c => c.life > 0);
  G.floats.forEach(f => { f.life -= dt; f.y -= 40 * dt; });
  G.floats = G.floats.filter(f => f.life > 0);
  G.bubbles.forEach(b => b.life -= dt);
  G.bubbles = G.bubbles.filter(b => b.life > 0);
  G.shake *= Math.pow(0.01, dt);
}

/* =========================================================
   OYUN AKIŞI
   ========================================================= */

function startGame() {
  newGame();
  G.mode = 'play';
  Sound.init();
  Sound.horn();
  setTimeout(() => Sound.gull(0.06), 600);
}

function bestScore() { return parseInt(store('simit_best') || '0', 10) || 0; }

function endGame() {
  G.mode = 'end';
  G.endAt = performance.now();
  G.prevBest = bestScore();
  G.record = G.score > G.prevBest;
  if (G.record) store('simit_best', String(G.score));
  G.drag = null;
  Sound.horn();
}

/* =========================================================
   GİRİŞ (tek parmak / fare)
   ========================================================= */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let view = { s: 1, ox: 0, oy: 0, dpr: 1 };

function toLogical(cx, cy) { return { x: (cx - view.ox) / view.s, y: (cy - view.oy) / view.s }; }

const ICON_SOUND = { x: VW - 78, y: 16, w: 30, h: 30 };
const ICON_PAUSE = { x: VW - 40, y: 16, w: 30, h: 30 };
let hudDy = 0;
const inIcon = (p, r) => p.x > r.x - 8 && p.x < r.x + r.w + 8 && p.y > r.y - 8 && p.y < r.y + r.h + 8;

let activePointer = null;
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  const p = toLogical(e.clientX, e.clientY);
  Sound.init();
  if (G.mode === 'start') { startGame(); return; }
  if (G.mode === 'end') { if (performance.now() - G.endAt > 900) startGame(); return; }
  if (G.mode === 'pause') { G.mode = 'play'; return; }
  const ph = { x: p.x, y: p.y - hudDy };
  if (inIcon(ph, ICON_SOUND)) { Sound.toggle(); return; }
  if (inIcon(ph, ICON_PAUSE)) { G.mode = 'pause'; G.drag = null; return; }
  if (activePointer !== null) return;      // tek parmak
  if (G.stock <= 0) {
    addBubble(BASKET.x - 30, BASKET.y - 60, 'Simit bitti, bekle!', '#fffde7', true, 1.2);
    return;
  }
  activePointer = e.pointerId;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  G.drag = { x0: p.x, y0: p.y, x: p.x, y: p.y };
});
// Pencere dinleyicisi + pointer capture: imleç tuvalden veya pencereden
// çıksa da çekiş sürer, bırakınca atış yapılır.
function onPointerMove(e) {
  if (e.pointerId !== activePointer || !G.drag) return;
  const p = toLogical(e.clientX, e.clientY);
  G.drag.x = p.x; G.drag.y = p.y;
}
function release(e, cancel) {
  if (e.pointerId !== activePointer) return;
  activePointer = null;
  try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
  const d = G.drag; G.drag = null;
  if (!d || cancel || G.mode !== 'play') return;
  const v = dragVelocity(d);
  if (v.pull >= MIN_PULL && v.vy < 0) throwSimit(v.vx, v.vy);
}
window.addEventListener('pointermove', onPointerMove, true);
window.addEventListener('pointerup', e => release(e, false), true);
window.addEventListener('pointercancel', e => release(e, true), true);
window.addEventListener('keydown', e => {
  if ((e.code === 'Space' || e.code === 'Escape' || e.code === 'KeyP') && (G.mode === 'play' || G.mode === 'pause')) {
    e.preventDefault(); G.mode = G.mode === 'play' ? 'pause' : 'play'; G.drag = null;
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && G.mode === 'play') { G.mode = 'pause'; G.drag = null; } });

function resize() {
  const w = window.innerWidth, h = window.innerHeight, dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  const s = Math.min(w / VW, h / VH);
  view = { s, ox: (w - VW * s) / 2, oy: (h - VH * s) / 2, dpr, w, h };
}
window.addEventListener('resize', resize);

/* =========================================================
   ÇİZİM
   ========================================================= */

let T = 0; // görsel zaman (sn)

function render() {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = '#1a1026'; ctx.fillRect(0, 0, view.w, view.h);
  ctx.setTransform(view.dpr * view.s, 0, 0, view.dpr * view.s, view.dpr * view.ox, view.dpr * view.oy);
  ctx.save();
  // Telefonda üst/alt boşluklar gökyüzü ve güverte ile doldurulur (siyah bant kalmaz)
  const extT = view.oy / view.s, extB = (view.h - view.oy) / view.s - VH;
  ctx.beginPath(); ctx.rect(0, -extT, VW, VH + extT + extB); ctx.clip();
  if (extT > 0) {
    ctx.fillStyle = '#2b1d4e'; ctx.fillRect(-20, -extT - 20, VW + 40, extT + 22);
    ctx.fillStyle = '#6d4425'; ctx.fillRect(-20, VH - 2, VW + 40, extB + 22);
  }
  if (G.shake > 0.3) ctx.translate(rand(-G.shake, G.shake), rand(-G.shake, G.shake));

  drawSky();
  drawSkyline();
  drawSea();
  G.gulls.forEach(drawGull);
  drawDeck();
  G.simits.forEach(s => drawSimit(s.x, s.y, 1, s.rot));
  drawHand();
  if (G.drag && G.mode === 'play') drawAim();
  drawEffects();
  ctx.restore();
  // Bilgi çubuğu ekranın gerçek üst kenarına yakın dursun
  hudDy = -Math.max(0, extT - 6);
  ctx.translate(0, hudDy);
  drawHud();
  ctx.translate(0, -hudDy);
  if (G.mode === 'start') drawStartCard();
  if (G.mode === 'pause') drawPauseCard();
  if (G.mode === 'end') drawEndCard();
}

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, HORIZON);
  g.addColorStop(0, '#2b1d4e'); g.addColorStop(0.35, '#6a3d7a'); g.addColorStop(0.65, '#e0677a');
  g.addColorStop(0.88, '#f8a35b'); g.addColorStop(1, '#ffd27a');
  ctx.fillStyle = g; ctx.fillRect(-20, -20, VW + 40, HORIZON + 22);
  // yıldızlar (üstte hafif)
  ctx.fillStyle = '#ffffff55';
  for (let k = 0; k < 18; k++) ctx.fillRect((k * 97) % VW, (k * 53) % 140, 1.5, 1.5);
  // güneş
  const sx = 330, sy = HORIZON - 6;
  const sg = ctx.createRadialGradient(sx, sy, 10, sx, sy, 140);
  sg.addColorStop(0, '#fff3c4'); sg.addColorStop(0.25, '#ffcf6b99'); sg.addColorStop(1, '#ffcf6b00');
  ctx.fillStyle = sg; ctx.fillRect(sx - 140, sy - 140, 280, 280);
  ctx.fillStyle = '#fff1b8'; ctx.beginPath(); ctx.arc(sx, sy, 38, Math.PI, 0); ctx.fill();
  // bulutlar
  ctx.fillStyle = '#ffb38a66';
  for (let k = 0; k < 4; k++) {
    const x = ((k * 170 + T * (6 + k * 2)) % (VW + 200)) - 100, y = 150 + k * 55;
    cloud(x, y, 1 + k * 0.15);
  }
}
function cloud(x, y, s) {
  ctx.beginPath();
  ctx.ellipse(x, y, 60 * s, 10 * s, 0, 0, Math.PI * 2);
  ctx.ellipse(x + 30 * s, y - 6 * s, 35 * s, 9 * s, 0, 0, Math.PI * 2);
  ctx.fill();
}

// İstanbul silueti: Süleymaniye, Galata Kulesi, köprü, Kız Kulesi
function drawSkyline() {
  const far = '#5b3566', mid = '#3d2049';
  // uzak tepeler
  ctx.fillStyle = far;
  ctx.beginPath(); ctx.moveTo(0, HORIZON);
  for (let x = 0; x <= VW; x += 20) ctx.lineTo(x, HORIZON - 22 - Math.sin(x * 0.012) * 10 - Math.sin(x * 0.05) * 3);
  ctx.lineTo(VW, HORIZON); ctx.fill();

  ctx.fillStyle = mid;
  // Süleymaniye'nin tepesi ve binalar
  ctx.beginPath(); ctx.moveTo(0, HORIZON);
  ctx.quadraticCurveTo(90, HORIZON - 40, 190, HORIZON - 44);
  ctx.quadraticCurveTo(290, HORIZON - 40, 330, HORIZON - 12);
  ctx.lineTo(330, HORIZON); ctx.fill();
  for (let k = 0; k < 14; k++) {
    const x = 6 + k * 23, h = 8 + ((k * 37) % 17);
    ctx.fillRect(x, HORIZON - 30 - h + Math.abs(k - 7) * 2, 18, h + 30);
  }
  // Süleymaniye Camii
  const cx = 190, by = HORIZON - 52;
  ctx.fillRect(cx - 62, by - 8, 124, 20);
  dome(cx, by - 8, 34, 26);
  dome(cx - 40, by - 4, 15, 11); dome(cx + 40, by - 4, 15, 11);
  dome(cx - 22, by - 10, 18, 13); dome(cx + 22, by - 10, 18, 13);
  ctx.fillRect(cx - 2, by - 48, 4, 14);                         // alem
  [[-78, 92], [-66, 72], [66, 72], [78, 92]].forEach(([dx, h]) => minaret(cx + dx, by + 12, h));

  // Galata Kulesi ve Beyoğlu
  ctx.fillStyle = mid;
  ctx.beginPath(); ctx.moveTo(340, HORIZON);
  ctx.quadraticCurveTo(400, HORIZON - 36, 470, HORIZON - 18); ctx.lineTo(470, HORIZON); ctx.fill();
  for (let k = 0; k < 6; k++) ctx.fillRect(345 + k * 20, HORIZON - 36 - ((k * 29) % 14), 16, 40);
  const gx = 405, gb = HORIZON - 30;
  ctx.fillRect(gx - 13, gb - 78, 26, 80);
  ctx.fillRect(gx - 16, gb - 88, 32, 10);
  ctx.beginPath(); ctx.moveTo(gx - 15, gb - 88); ctx.lineTo(gx, gb - 124); ctx.lineTo(gx + 15, gb - 88); ctx.fill();
  ctx.fillStyle = '#ffd77a';
  for (let k = 0; k < 3; k++) ctx.fillRect(gx - 9 + k * 7, gb - 85, 3, 5);
  ctx.fillRect(gx - 1.5, gb - 50, 3, 6);

  // Köprü (sağda, kuleler ve halatlar)
  const tx = 500, ty = HORIZON - 70;
  ctx.strokeStyle = mid; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(440, HORIZON - 26); ctx.lineTo(VW, HORIZON - 26); ctx.stroke();
  ctx.fillStyle = mid; ctx.fillRect(tx - 4, ty, 8, 70);
  ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(tx, ty); ctx.quadraticCurveTo(470, HORIZON - 30, 440, HORIZON - 30); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(tx, ty); ctx.quadraticCurveTo(530, HORIZON - 34, VW + 20, HORIZON - 50); ctx.stroke();
  ctx.strokeStyle = '#ffd77a99'; ctx.setLineDash([2, 6]);
  ctx.beginPath(); ctx.moveTo(440, HORIZON - 25); ctx.lineTo(VW, HORIZON - 25); ctx.stroke(); ctx.setLineDash([]);
}
function dome(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, Math.PI, 0); ctx.fill(); }
function minaret(x, base, h) {
  ctx.fillRect(x - 2.5, base - h, 5, h);
  ctx.fillRect(x - 4, base - h * 0.62, 8, 2); ctx.fillRect(x - 4, base - h * 0.82, 8, 2);
  ctx.beginPath(); ctx.moveTo(x - 3, base - h); ctx.lineTo(x, base - h - 14); ctx.lineTo(x + 3, base - h); ctx.fill();
}

function drawSea() {
  const g = ctx.createLinearGradient(0, HORIZON, 0, DECK_Y);
  g.addColorStop(0, '#f2a76b'); g.addColorStop(0.15, '#b85d7a'); g.addColorStop(0.6, '#3d3a78'); g.addColorStop(1, '#1f2552');
  ctx.fillStyle = g; ctx.fillRect(-20, HORIZON, VW + 40, DECK_Y - HORIZON);
  // güneş yansıması
  for (let k = 0; k < 16; k++) {
    const y = HORIZON + 6 + k * 14, w = 50 - k * 2 + Math.sin(T * 2 + k) * 10;
    ctx.fillStyle = 'rgba(255,225,150,' + (0.5 - k * 0.028) + ')';
    ctx.fillRect(330 - w / 2 + Math.sin(T * 1.5 + k * 0.7) * 6, y, w, 2.5);
  }
  // dalgalar
  ctx.strokeStyle = '#ffffff22'; ctx.lineWidth = 1.5;
  for (let r = 0; r < 9; r++) {
    const y = HORIZON + 20 + r * r * 4.2, amp = 1 + r * 0.5, sp = 0.6 + r * 0.15;
    ctx.beginPath();
    for (let x = 0; x <= VW; x += 12) {
      const yy = y + Math.sin(x * 0.04 + T * sp * 2 + r) * amp;
      x === 0 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy);
    }
    ctx.stroke();
  }
  // Kız Kulesi
  const kx = 92, ky = 585;
  ctx.fillStyle = '#2a1736';
  ctx.beginPath(); ctx.ellipse(kx, ky + 4, 46, 8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillRect(kx - 34, ky - 16, 52, 18);
  ctx.fillRect(kx + 6, ky - 52, 16, 40);
  ctx.beginPath(); ctx.moveTo(kx + 3, ky - 52); ctx.lineTo(kx + 14, ky - 74); ctx.lineTo(kx + 25, ky - 52); ctx.fill();
  ctx.fillRect(kx + 13, ky - 82, 2, 9);
  ctx.fillRect(kx - 28, ky - 24, 18, 10);
  ctx.fillStyle = Math.sin(T * 3) > 0 ? '#ffe082' : '#ffb300';
  ctx.beginPath(); ctx.arc(kx + 14, ky - 40, 2.5, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffd77a'; ctx.fillRect(kx - 22, ky - 10, 3, 4); ctx.fillRect(kx - 10, ky - 10, 3, 4);
  // yansıması
  ctx.fillStyle = '#2a173655';
  ctx.fillRect(kx - 30, ky + 10, 50, 6 + Math.sin(T * 2) * 2);
}

function drawGull(g) {
  const s = g.size * (g.kind === 'thief' ? 1.05 : 1);
  const dir = g.vx >= 0 ? 1 : -1;
  const flap = Math.sin(g.flap);
  ctx.save();
  ctx.translate(g.x, g.y); ctx.scale(dir * s, s);
  if (g.kind === 'gold') {
    const gl = ctx.createRadialGradient(0, 0, 4, 0, 0, 46);
    gl.addColorStop(0, '#fff59daa'); gl.addColorStop(1, '#fff59d00');
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(0, 0, 46, 0, 7); ctx.fill();
  }
  const body = g.kind === 'gold' ? '#ffd54f' : g.kind === 'thief' ? '#78909c' : '#fafafa';
  const wing = g.kind === 'gold' ? '#ffb300' : g.kind === 'thief' ? '#455a64' : '#b0bec5';
  // arka kanat
  ctx.fillStyle = wing;
  ctx.beginPath(); ctx.moveTo(-4, -2); ctx.quadraticCurveTo(-10, -18 * flap - 4, -2, -30 * flap - 2); ctx.quadraticCurveTo(6, -14 * flap, 6, -2); ctx.fill();
  // gövde
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.ellipse(0, 0, 18, 8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-16, -2); ctx.lineTo(-26, -6); ctx.lineTo(-24, 3); ctx.fill(); // kuyruk
  ctx.fillStyle = '#37474f'; ctx.beginPath(); ctx.moveTo(-22, -5); ctx.lineTo(-26, -6); ctx.lineTo(-25, -1); ctx.fill();
  // kafa
  ctx.fillStyle = body; ctx.beginPath(); ctx.arc(16, -5, 7, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffb300'; ctx.beginPath(); ctx.moveTo(22, -6); ctx.lineTo(31, -3); ctx.lineTo(22, -1); ctx.fill();
  ctx.fillStyle = '#d84315'; ctx.fillRect(27, -3.5, 2, 1.5);
  ctx.fillStyle = '#212121'; ctx.beginPath(); ctx.arc(18, -7, 1.6, 0, 7); ctx.fill();
  if (g.kind === 'thief') { // hırsız maskesi ve kaş
    ctx.fillStyle = '#263238'; ctx.fillRect(13, -9.5, 9, 3.5);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(18, -8, 1.2, 0, 7); ctx.fill();
  }
  // ön kanat
  ctx.fillStyle = wing;
  ctx.beginPath(); ctx.moveTo(-6, -1); ctx.quadraticCurveTo(-4, -22 * flap - 6, 8, -36 * flap - 4); ctx.quadraticCurveTo(10, -16 * flap, 8, -1); ctx.fill();
  ctx.fillStyle = '#263238';
  ctx.beginPath(); ctx.arc(8, -36 * flap - 4, 2.2, 0, 7); ctx.fill();
  if (g.carrying) drawSimit(30, 2, 0.55, 0);
  ctx.restore();
}

function drawSimit(x, y, sc, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sc, sc);
  ctx.strokeStyle = '#8d4a1d'; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = '#c47a3a'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = '#fff3d6';
  for (let k = 0; k < 9; k++) { const a = k * 0.7; ctx.fillRect(Math.cos(a) * 11 - 1, Math.sin(a) * 11 - 1, 2, 1.4); }
  ctx.restore();
}

function drawDeck() {
  // arka korkuluk
  ctx.fillStyle = '#e9edf2';
  ctx.fillRect(0, 760, VW, 6);
  ctx.fillRect(0, 800, VW, 4);
  for (let x = 10; x < VW; x += 34) ctx.fillRect(x, 760, 4, 100);
  ctx.fillStyle = '#c62828'; ctx.fillRect(0, 838, VW, 22); // vapurun kırmızı bandı
  // can simidi
  ctx.strokeStyle = '#ff7043'; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.arc(270, 812, 15, 0, 7); ctx.stroke();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 7; ctx.setLineDash([6, 6]);
  ctx.beginPath(); ctx.arc(270, 812, 15, 0, 7); ctx.stroke(); ctx.setLineDash([]);

  // yolcular
  G.passengers.forEach(drawPassenger);

  // güverte zemini
  const g = ctx.createLinearGradient(0, DECK_Y, 0, VH);
  g.addColorStop(0, '#9c6b3f'); g.addColorStop(1, '#6d4425');
  ctx.fillStyle = g; ctx.fillRect(-20, DECK_Y, VW + 40, VH - DECK_Y + 20);
  ctx.strokeStyle = '#5a361b88'; ctx.lineWidth = 1.5;
  for (let k = -6; k <= 6; k++) { ctx.beginPath(); ctx.moveTo(270 + k * 40, DECK_Y); ctx.lineTo(270 + k * 95, VH); ctx.stroke(); }
  for (let y = DECK_Y + 22; y < VH; y += 26) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(VW, y); ctx.stroke(); }

  // simit sepeti (stok)
  ctx.fillStyle = '#8d6e63';
  ctx.beginPath(); ctx.moveTo(BASKET.x - 50, BASKET.y - 10); ctx.lineTo(BASKET.x + 50, BASKET.y - 10);
  ctx.lineTo(BASKET.x + 40, BASKET.y + 40); ctx.lineTo(BASKET.x - 40, BASKET.y + 40); ctx.fill();
  ctx.strokeStyle = '#5d4037'; ctx.lineWidth = 2;
  for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.moveTo(BASKET.x - 46 + k, BASKET.y + k * 12); ctx.lineTo(BASKET.x + 46 - k, BASKET.y + k * 12); ctx.stroke(); }
  for (let k = 0; k < G.stock; k++) {
    const col = k % 4, row = Math.floor(k / 4);
    drawSimit(BASKET.x - 33 + col * 22, BASKET.y - 14 - row * 13, 0.75, 0);
  }
  if (G.stock < STOCK_MAX && G.mode === 'play') { // dolma göstergesi
    ctx.strokeStyle = '#ffe082'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(BASKET.x + 58, BASKET.y - 10, 8, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * G.refill / REFILL); ctx.stroke();
  }
}

function drawPassenger(p) {
  const bob = Math.sin(T * 2 + p.x) * 1.5;
  const wave = p.hungry > 0;
  const x = p.x + (p.hit > 0 ? Math.sin(T * 50) * 3 : 0), y = PASSENGER_HEAD_Y + bob;
  // gövde
  ctx.fillStyle = p.col;
  roundRect(x - 20, y + 16, 40, 60, 12); ctx.fill();
  // kollar
  ctx.strokeStyle = p.col; ctx.lineWidth = 8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x - 16, y + 26); ctx.lineTo(x - 24, y + 56); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + 16, y + 26);
  if (wave) { const a = Math.sin(T * 12) * 8; ctx.lineTo(x + 30 + a, y - 8); }
  else if (p.eat > 0) ctx.lineTo(x + 8, y + 6);
  else ctx.lineTo(x + 24, y + 56);
  ctx.stroke();
  if (wave) { ctx.fillStyle = '#ffcc99'; ctx.beginPath(); ctx.arc(x + 30 + Math.sin(T * 12) * 8, y - 12, 5, 0, 7); ctx.fill(); }
  // kafa
  ctx.fillStyle = p.hit > 0 ? '#ff8a80' : '#ffcc99';
  ctx.beginPath(); ctx.arc(x, y, 15, 0, 7); ctx.fill();
  ctx.fillStyle = p.hair;
  ctx.beginPath(); ctx.arc(x, y - 3, 15, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();
  if (p.hat) { ctx.fillStyle = '#37474f'; ctx.fillRect(x - 15, y - 15, 30, 5); ctx.fillRect(x - 10, y - 24, 20, 10); }
  // yüz
  ctx.fillStyle = '#3e2723';
  if (p.hit > 0) { // şaşkın
    ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('x  x', x, y + 1);
    ctx.beginPath(); ctx.arc(x, y + 7, 3, 0, 7); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(x - 5, y - 1, 1.6, 0, 7); ctx.arc(x + 5, y - 1, 1.6, 0, 7); ctx.fill();
    ctx.strokeStyle = '#3e2723'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (wave) ctx.arc(x, y + 7, 4, 0, Math.PI);           // ağzı açık, bekliyor
    else ctx.arc(x, y + 4, 4, 0.2 * Math.PI, 0.8 * Math.PI);
    ctx.stroke();
  }
  if (p.eat > 0) drawSimit(x + 8, y + 8, 0.6, T * 2);
  if (wave) { // "aç" işareti
    ctx.fillStyle = '#ffeb3b'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('!', x, y - 26 + Math.sin(T * 8) * 3);
  }
}

function drawHand() {
  let ox = 0, oy = 0;
  if (G.drag && G.mode === 'play') {
    const dx = G.drag.x - G.drag.x0, dy = G.drag.y - G.drag.y0, d = Math.hypot(dx, dy) || 1;
    const eff = d * pullScale();
    const m = Math.min(eff, 260) / 260 * 55;
    ox = dx / d * m; oy = dy / d * m;
  } else if (G.handCooldown > 0) oy = -G.handCooldown * 60;
  const x = HAND.x + ox, y = HAND.y + oy;
  // kol
  ctx.fillStyle = '#ffcc99';
  ctx.beginPath(); ctx.moveTo(x - 18, y + 10); ctx.lineTo(x + 18, y + 10); ctx.lineTo(HAND.x + 26, VH + 300); ctx.lineTo(HAND.x - 26, VH + 300); ctx.fill();
  ctx.fillStyle = '#1565c0'; // gömlek kolu
  ctx.beginPath(); ctx.moveTo(HAND.x - 30, VH - 30); ctx.lineTo(HAND.x + 30, VH - 30); ctx.lineTo(HAND.x + 34, VH + 300); ctx.lineTo(HAND.x - 34, VH + 300); ctx.fill();
  // avuç
  ctx.fillStyle = '#ffcc99';
  ctx.beginPath(); ctx.ellipse(x, y + 8, 22, 16, 0, 0, Math.PI * 2); ctx.fill();
  if (G.stock > 0 && G.handCooldown <= 0 && G.mode !== 'end') drawSimit(x, y - 6, 1, 0);
  // baş parmak
  ctx.fillStyle = '#f5b98a';
  ctx.beginPath(); ctx.ellipse(x - 18, y, 6, 11, -0.4, 0, Math.PI * 2); ctx.fill();
  for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.ellipse(x - 8 + k * 9, y + 16, 5, 7, 0, 0, Math.PI * 2); ctx.fill(); }
}

// Nişan: geri çekme çizgisi ve kısa yörünge noktaları
function drawAim() {
  const d = G.drag, v = dragVelocity(d);
  ctx.strokeStyle = '#ffffff55'; ctx.lineWidth = 3; ctx.setLineDash([4, 6]);
  ctx.beginPath(); ctx.moveTo(d.x0, d.y0); ctx.lineTo(d.x, d.y); ctx.stroke(); ctx.setLineDash([]);
  if (v.pull < MIN_PULL || v.vy >= 0) return;
  const power = Math.hypot(v.vx, v.vy) / MAX_SPEED;
  for (let k = 1; k <= 7; k++) {
    const t = k * 0.05;
    const x = HAND.x + v.vx * t, y = HAND.y - 6 + v.vy * t + 0.5 * GRAVITY * t * t;
    ctx.fillStyle = 'rgba(255,255,255,' + (0.9 - k * 0.11) + ')';
    ctx.beginPath(); ctx.arc(x, y, 5 - k * 0.45, 0, 7); ctx.fill();
  }
  // güç çubuğu
  ctx.fillStyle = '#00000055'; roundRect(HAND.x - 40, HAND.y + 40, 80, 8, 4); ctx.fill();
  ctx.fillStyle = power > 0.9 ? '#ff7043' : '#ffe082'; roundRect(HAND.x - 40, HAND.y + 40, 80 * power, 8, 4); ctx.fill();
}

function drawEffects() {
  G.crumbs.forEach(c => { ctx.globalAlpha = Math.min(1, c.life * 2); ctx.fillStyle = c.col; ctx.fillRect(c.x, c.y, c.r, c.r); });
  ctx.globalAlpha = 1;
  G.bubbles.forEach(drawBubble);
  G.floats.forEach(f => {
    ctx.globalAlpha = Math.min(1, f.life * 2);
    const pop = 1 + Math.max(0, f.life - 1.1) * 2;
    ctx.font = '900 ' + Math.round(f.size * pop) + 'px system-ui, sans-serif'; ctx.textAlign = 'center';
    const w = ctx.measureText(f.text).width, x = clamp(f.x, w / 2 + 6, VW - w / 2 - 6);
    ctx.lineWidth = 5; ctx.strokeStyle = '#2b1d4e'; ctx.strokeText(f.text, x, f.y);
    ctx.fillStyle = f.col; ctx.fillText(f.text, x, f.y);
  });
  ctx.globalAlpha = 1;
}

function drawBubble(b) {
  const age = b.max - b.life, sc = Math.min(1, age * 7);
  ctx.globalAlpha = Math.min(1, b.life * 3);
  ctx.font = 'bold 17px system-ui, sans-serif';
  const w = ctx.measureText(b.text).width + 20, h = 30;
  const bx = clamp(b.x - w / 2, 6, VW - w - 6), by = clamp(b.y - h - 12, 50, VH - h);
  ctx.save();
  ctx.translate(b.x, b.y); ctx.scale(sc, sc); ctx.translate(-b.x, -b.y);
  ctx.fillStyle = b.bg; ctx.strokeStyle = '#2b1d4e'; ctx.lineWidth = 2;
  roundRect(bx, by, w, h, 14); ctx.fill(); ctx.stroke();
  const tx = clamp(b.x, bx + 14, bx + w - 14);
  ctx.beginPath(); ctx.moveTo(tx - 6, by + h - 1); ctx.lineTo(tx, by + h + 10); ctx.lineTo(tx + 6, by + h - 1); ctx.fill();
  ctx.beginPath(); ctx.moveTo(tx - 6, by + h); ctx.lineTo(tx, by + h + 10); ctx.lineTo(tx + 6, by + h); ctx.stroke();
  ctx.fillStyle = '#2b1d4e'; ctx.textAlign = 'center'; ctx.fillText(b.text, bx + w / 2, by + 21);
  ctx.restore();
  ctx.globalAlpha = 1;
}

// Köşedeki küçük bilgi: puan + süre, ses ve duraklat simgeleri
function drawHud() {
  if (G.mode === 'start') return;
  ctx.save();
  ctx.fillStyle = '#00000040'; roundRect(10, 12, 150, 38, 12); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '800 20px system-ui, sans-serif'; ctx.textAlign = 'left';
  const left = Math.max(0, Math.ceil(ROUND - G.t));
  ctx.fillText(fmt(G.score), 22, 38);
  ctx.textAlign = 'right';
  ctx.fillStyle = left <= 10 && G.mode === 'play' && Math.sin(T * 10) > 0 ? '#ff8a80' : '#ffe082';
  ctx.fillText(left + ' sn', 150, 38);
  // ses simgesi
  const s = ICON_SOUND;
  ctx.fillStyle = '#ffffffcc';
  ctx.beginPath(); ctx.moveTo(s.x + 3, s.y + 11); ctx.lineTo(s.x + 9, s.y + 11); ctx.lineTo(s.x + 16, s.y + 5);
  ctx.lineTo(s.x + 16, s.y + 25); ctx.lineTo(s.x + 9, s.y + 19); ctx.lineTo(s.x + 3, s.y + 19); ctx.fill();
  ctx.strokeStyle = '#ffffffcc'; ctx.lineWidth = 2.2;
  if (Sound.muted) { ctx.beginPath(); ctx.moveTo(s.x + 19, s.y + 10); ctx.lineTo(s.x + 27, s.y + 20); ctx.moveTo(s.x + 27, s.y + 10); ctx.lineTo(s.x + 19, s.y + 20); ctx.stroke(); }
  else { ctx.beginPath(); ctx.arc(s.x + 16, s.y + 15, 6, -0.8, 0.8); ctx.stroke(); ctx.beginPath(); ctx.arc(s.x + 16, s.y + 15, 11, -0.8, 0.8); ctx.stroke(); }
  // duraklat simgesi
  const p = ICON_PAUSE;
  ctx.fillRect(p.x + 8, p.y + 6, 5, 18); ctx.fillRect(p.x + 18, p.y + 6, 5, 18);
  ctx.restore();
}

function card(h) {
  ctx.fillStyle = '#1a102699'; ctx.fillRect(-20, -2000, VW + 40, VH + 4000);
  const y = (VH - h) / 2;
  ctx.fillStyle = '#fffaf0'; roundRect(40, y, VW - 80, h, 26); ctx.fill();
  ctx.strokeStyle = '#c62828'; ctx.lineWidth = 6; roundRect(40, y, VW - 80, h, 26); ctx.stroke();
  return y;
}
function text(t, x, y, size, col, weight) {
  ctx.font = (weight || 800) + ' ' + size + 'px system-ui, sans-serif';
  ctx.fillStyle = col || '#2b1d4e'; ctx.textAlign = 'center'; ctx.fillText(t, x, y);
}

function drawStartCard() {
  const y = card(330);
  drawSimit(VW / 2, y + 58, 2, T);
  text('Martılara Simit At', VW / 2, y + 140, 38, '#c62828', 900);
  text('Parmağını geri çek, bırak: simit uçsun,', VW / 2, y + 184, 19, '#2b1d4e', 600);
  text('martılar havada kapsın!', VW / 2, y + 210, 19, '#2b1d4e', 600);
  const b = bestScore();
  if (b) text('En iyi skorun: ' + fmt(b), VW / 2, y + 245, 17, '#6d4c41', 600);
  text('Dokun ve başla', VW / 2, y + 295 + Math.sin(T * 4) * 3, 28, '#e65100', 900);
}
function drawPauseCard() {
  const y = card(170);
  text('Duraklatıldı', VW / 2, y + 72, 34, '#2b1d4e', 900);
  text('Devam etmek için dokun', VW / 2, y + 120, 20, '#e65100', 700);
}
function drawEndCard() {
  const y = card(400);
  text('Vapur iskeleye yanaştı!', VW / 2, y + 60, 26, '#c62828', 900);
  text('Bugün ' + G.fed + ' martı doyurdun', VW / 2, y + 112, 27, '#2b1d4e', 800);
  text(fmt(G.score), VW / 2, y + 190, 64, '#e65100', 900);
  text('puan', VW / 2, y + 220, 18, '#6d4c41', 600);
  if (G.record) text('YENİ REKOR!', VW / 2, y + 262, 24, '#2e7d32', 900);
  else text('En iyi skor: ' + fmt(G.prevBest), VW / 2, y + 262, 20, '#6d4c41', 700);
  text('En uzun kombo: x' + G.bestCombo + '   ·   Atılan simit: ' + G.thrown, VW / 2, y + 298, 16, '#6d4c41', 600);
  if (performance.now() - G.endAt > 900) text('Tekrar oynamak için dokun', VW / 2, y + 360 + Math.sin(T * 4) * 3, 23, '#e65100', 900);
}

function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* =========================================================
   ANA DÖNGÜ
   ========================================================= */

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  T += dt;
  if (!G.manual) step(dt);
  if (G.mode === 'start' || G.mode === 'end') { // başlangıç ve bitiş ekranında martılar süzülsün
    G.gulls.forEach(g => updateGull(g, dt));
    G.gulls = G.gulls.filter(g => !g.gone);
    if (G.gulls.length < 3) addGull('normal');
  }
  if (G.mode !== 'play') updateEffects(dt * 0.5);
  render();
  requestAnimationFrame(frame);
}

newGame();
// Başlangıç ekranının arkasında birkaç martı uçsun
for (let k = 0; k < 3; k++) { addGull('normal'); G.gulls[k].x = 80 + k * 170; }
resize();
requestAnimationFrame(frame);

// Test kolaylığı için (oyunu etkilemez)
window.sg = { get G() { return G; }, step, startGame, throwSimit, toLogical, get view() { return view; }, HAND, GRAVITY, MAX_SPEED, PULL_K, ROUND };
</script>
