<script>
'use strict';

/* =========================================================
   AYARLAR
   ========================================================= */

const VW = 540, VH = 960;
const ROUND = 60;
const GRAVITY = 900;
const MAX_SPEED = 1350;
const PULL_K = 5;
const MIN_PULL = 18;
const HAND = { x: 270, y: 868 };
const BASKET = { x: 468, y: 905 };
const STOCK_MAX = 8;
const CATCH_R = 24;
const HOMING_R = 80;
const HOMING_SPEED = 50;
const HORIZON = 520, DECK_Y = 860;
const PASSENGER_HEAD_Y = 792;
const GAME_URL = 'https://danerlabs.github.io/vibecode/martilara-simit/';

const LINES_FED = ['Mmm, susamlı!', 'Sağ ol hemşerim!', 'Çay da var mı?', 'Bir tane daha!',
  'Kaşar da olsaydı!', 'Oh be!', 'Simit dediğin böyle!', 'Taze mi bu?', 'Eline sağlık!', 'Yaşasın vapur!'];
const LINES_THIEF = ['Bu benim artık!', 'Hehe, sağ ol!', 'Kim bakıyor ki?', 'Sepet benim!'];
const LINES_THIEF_HIT = ['Tamam tamam gidiyorum!', 'Aa, yakalandım!', 'Bir daha yapmam!'];

// goal: bu puanı geçince sonraki hat açılır. 0 = son hat.
const ROUTES = [
  { id: 'eminonu', name: 'Eminönü–Kadıköy', diff: 'Kolay', goal: 120, speed: 1, extra: 0, refill: 1.4, wind: 0.55 },
  { id: 'karakoy', name: 'Karaköy–Üsküdar', diff: 'Orta', goal: 220, speed: 1.16, extra: 0, refill: 1.65, wind: 0.85 },
  { id: 'besiktas', name: 'Beşiktaş–Kadıköy', diff: 'Zor', goal: 0, speed: 1.32, extra: 1, refill: 1.9, wind: 1 },
];
const TIMES = [
  { id: 'sabah', name: 'Sabah', sky: ['#8ec6ef', '#f6d7b0', '#ffe3b8', '#ffd19a'], sea: ['#f3c9a4', '#7eafd0', '#35688f', '#1c4568'], star: 0, lights: 0, sun: 'rise' },
  { id: 'ogle', name: 'Öğle', sky: ['#3d9ae6', '#7ec4f6', '#d7efff', '#eef7ff'], sea: ['#8fd0ef', '#3c92c8', '#1d6294', '#123e66'], star: 0, lights: 0, sun: 'high' },
  { id: 'gunbatimi', name: 'Gün batımı', sky: ['#2b1d4e', '#6a3d7a', '#e0677a', '#ffd27a'], sea: ['#f2a76b', '#b85d7a', '#3d3a78', '#1f2552'], star: 0.35, lights: 0.45, sun: 'set' },
  { id: 'gece', name: 'Gece', sky: ['#070b1c', '#141a3c', '#1b2754', '#24325f'], sea: ['#1a2748', '#121c38', '#0c1428', '#080e1c'], star: 1, lights: 1, sun: 'moon' },
];

/* =========================================================
   YARDIMCILAR
   ========================================================= */

const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = n => Math.round(n).toLocaleString('tr-TR');
function store(k, v) {
  try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; }
}
function pad(n) { return String(n).padStart(2, '0'); }
function dateKey(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rollDay(dateStr) {
  const rnd = mulberry32(hashStr('simit-v1|' + dateStr));
  const route = Math.floor(rnd() * ROUTES.length);
  const time = Math.floor(rnd() * TIMES.length);
  const fog = rnd() < 0.42 ? Math.round((0.32 + rnd() * 0.4) * 100) / 100 : 0;
  const calm = rnd() < 0.22;
  const mag = calm ? 0 : Math.round(45 + rnd() * 100);
  const wind = mag * (rnd() < 0.5 ? -1 : 1);
  return { route, time, fog, wind, date: dateStr };
}
function rollFree(route) {
  const R = ROUTES[route];
  const time = Math.floor(Math.random() * TIMES.length);
  const fog = Math.random() < 0.14 + route * 0.08 ? Math.round((0.28 + Math.random() * 0.4) * 100) / 100 : 0;
  let wind = 0;
  if (Math.random() < 0.4 + route * 0.12) wind = Math.round((50 + Math.random() * 80) * R.wind) * (Math.random() < 0.5 ? -1 : 1);
  return { route, time, fog, wind, date: null };
}
function windWord(w) {
  const a = Math.abs(w || 0);
  if (a < 12) return 'rüzgarsız';
  return (a > 110 ? 'sert' : a > 65 ? 'orta' : 'hafif') + ' rüzgar ' + (w > 0 ? 'sağa' : 'sola');
}
function unlocked() {
  return clamp(parseInt(store('simit_unlock') || '0', 10) || 0, 0, ROUTES.length - 1);
}
function setUnlocked(n) { store('simit_unlock', String(clamp(Math.max(unlocked(), n), 0, ROUTES.length - 1))); }
function bestScore() { return parseInt(store('simit_best') || '0', 10) || 0; }
function dailyBest(date) {
  const raw = store('simit_daily') || '';
  const i = raw.indexOf(':');
  if (i < 0 || raw.slice(0, i) !== date) return 0;
  return parseInt(raw.slice(i + 1), 10) || 0;
}
function saveDaily(date, score) {
  const prev = dailyBest(date);
  if (score > prev) store('simit_daily', date + ':' + score);
  return score > prev;
}
function routeOf(g) { return ROUTES[(g && g.route) || 0] || ROUTES[0]; }
function palette() {
  const i = G && G.cond ? G.cond.time : 2;
  return TIMES[i] || TIMES[2];
}
function skyInk() {
  const id = palette().id;
  if (id === 'gece') return { far: '#1a2344', mid: '#12182e', light: '#ffe082' };
  if (id === 'ogle') return { far: '#8aafc4', mid: '#4e7690', light: '#fff6c8' };
  if (id === 'sabah') return { far: '#9a86a4', mid: '#5e4c70', light: '#ffe7b0' };
  return { far: '#5b3566', mid: '#3d2049', light: '#ffd77a' };
}

/* =========================================================
   SES
   ========================================================= */

const Sound = {
  ac: null, master: null, muted: store('simit_mute') === '1', noiseBuf: null,
  init() {
    if (!this.ac) {
      try {
        this.ac = new (window.AudioContext || window.webkitAudioContext)();
        this.master = this.ac.createGain();
        this.master.gain.value = this.muted ? 0 : 1;
        this.master.connect(this.ac.destination);
        const len = this.ac.sampleRate * 2;
        this.noiseBuf = this.ac.createBuffer(1, len, this.ac.sampleRate);
        const d = this.noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        this.startWaves();
      } catch (e) { this.ac = null; }
    }
    if (this.ac && this.ac.state === 'suspended') this.ac.resume();
  },
  toggle() {
    this.muted = !this.muted;
    store('simit_mute', this.muted ? '1' : '0');
    if (this.master) this.master.gain.value = this.muted ? 0 : 1;
  },
  env(g, t0, a, peak, rel) {
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + rel);
  },
  osc(type, f1, f2, dur, vol, delay) {
    if (!this.ac) return;
    const t0 = this.ac.currentTime + (delay || 0);
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + dur);
    this.env(g, t0, 0.01, vol, dur);
    o.connect(g).connect(this.master); o.start(t0); o.stop(t0 + dur + 0.05);
  },
  noise(f1, f2, dur, vol, q) {
    if (!this.ac) return;
    const t0 = this.ac.currentTime;
    const s = this.ac.createBufferSource(); s.buffer = this.noiseBuf;
    const f = this.ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = q || 1.5;
    f.frequency.setValueAtTime(f1, t0); f.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    const g = this.ac.createGain(); this.env(g, t0, 0.02, vol, dur);
    s.connect(f).connect(g).connect(this.master); s.start(t0); s.stop(t0 + dur + 0.05);
  },
  gull(vol) {
    if (!this.ac) return;
    const n = 1 + Math.floor(Math.random() * 3), base = rand(1300, 1900);
    for (let k = 0; k < n; k++) {
      const t0 = this.ac.currentTime + k * rand(0.22, 0.3);
      const o = this.ac.createOscillator(), lfo = this.ac.createOscillator(), lg = this.ac.createGain();
      const f = this.ac.createBiquadFilter(), g = this.ac.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(base * 1.15, t0);
      o.frequency.exponentialRampToValueAtTime(base * 0.6, t0 + 0.24);
      lfo.frequency.value = 28; lg.gain.value = 70; lfo.connect(lg).connect(o.frequency);
      f.type = 'bandpass'; f.frequency.value = 1900; f.Q.value = 4;
      this.env(g, t0, 0.03, vol || 0.05, 0.24);
      o.connect(f).connect(g).connect(this.master);
      o.start(t0); lfo.start(t0); o.stop(t0 + 0.32); lfo.stop(t0 + 0.32);
    }
  },
  horn() {
    if (!this.ac) return;
    const t0 = this.ac.currentTime;
    const f = this.ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 520;
    const g = this.ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.16, t0 + 0.2);
    g.gain.setValueAtTime(0.16, t0 + 1.4);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.0);
    [98, 147, 196.5].forEach(fr => {
      const o = this.ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = fr;
      o.connect(f); o.start(t0); o.stop(t0 + 2.1);
    });
    f.connect(g).connect(this.master);
  },
  startWaves() {
    const s = this.ac.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    const f = this.ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420;
    const g = this.ac.createGain(); g.gain.value = 0.025;
    const lfo = this.ac.createOscillator(), lg = this.ac.createGain();
    lfo.frequency.value = 0.15; lg.gain.value = 0.018; lfo.connect(lg).connect(g.gain);
    s.connect(f).connect(g).connect(this.master); s.start(); lfo.start();
  },
  throw()  { this.noise(500, 2400, 0.2, 0.25, 1.2); },
  catch(c) { this.osc('sine', 600, 1200, 0.09, 0.2); this.osc('triangle', 900 + c * 60, 1600 + c * 80, 0.1, 0.12, 0.07); },
  gold()   { [0, 1, 2, 3, 4].forEach(k => this.osc('sine', 880 * Math.pow(1.19, k), 900 * Math.pow(1.19, k), 0.12, 0.1, k * 0.06)); },
  bonk()   { this.osc('square', 220, 80, 0.18, 0.12); },
  thud()   { this.noise(300, 120, 0.12, 0.2, 0.8); },
  steal()  { this.osc('triangle', 900, 250, 0.35, 0.15); },
  yum()    { [0, 1, 2].forEach(k => this.osc('sine', 520 * Math.pow(1.26, k), 540 * Math.pow(1.26, k), 0.1, 0.12, k * 0.08)); },
};

/* =========================================================
   OYUN DURUMU
   ========================================================= */

let G = null;
const meta = { route: 0, daily: false, cond: null, note: '', noteT: 0 };

function makePassengers() {
  return [
    { x: 68, role: 'child', col: '#ef6c00', hair: '#4e342e', hat: false, hungry: 0, hit: 0, eat: 0, scare: 0, cool: 0 },
    { x: 176, role: 'tourist', col: '#1e88e5', hair: '#6d4c41', hat: false, hungry: 0, hit: 0, eat: 0, photo: 5, cool: 0 },
    { x: 276, role: 'normal', col: '#8e44ad', hair: '#eceff1', hat: true, hungry: 0, hit: 0, eat: 0, cool: 0 },
  ];
}

function newGame() {
  const cond = meta.cond || { route: meta.route || 0, time: 2, fog: 0, wind: 0, date: null };
  const route = cond.route || 0;
  G = {
    mode: 'start', t: 0, score: 0, fed: 0, combo: 0, bestCombo: 0, thrown: 0, hitsOnPeople: 0,
    stock: STOCK_MAX, refill: 0, handCooldown: 0,
    gulls: [], simits: [], crumbs: [], floats: [], bubbles: [],
    spawnTimer: 0.4, goldTimer: rand(12, 18), thiefTimer: rand(9, 14), hungryTimer: rand(6, 10),
    patronTimer: 10 + route * 2, sawPatron: false, sawVendor: false,
    cryTimer: 2, hornTimer: rand(14, 22), shake: 0, endAt: 0,
    passengers: makePassengers(),
    vendor: { x: 372, shout: 0, timer: 6.5 },
    drag: null,
    route, daily: !!meta.daily, cond,
    wind: cond.wind || 0, fog: cond.fog || 0,
    shareNote: '', justUnlocked: false, record: false, dailyRecord: false,
    prevBest: 0, dailyBest: 0,
  };
}

/* =========================================================
   SİMÜLASYON
   ========================================================= */

function step(dt) {
  if (G.mode !== 'play') return;
  G.t += dt;
  const refillT = routeOf(G).refill;
  if (G.stock < STOCK_MAX) {
    G.refill += dt;
    if (G.refill >= refillT) { G.refill = 0; G.stock++; }
  } else G.refill = 0;
  G.handCooldown = Math.max(0, G.handCooldown - dt);

  spawnGulls(dt);
  G.gulls.forEach(g => updateGull(g, dt));
  G.gulls = G.gulls.filter(g => !g.gone);
  G.simits.forEach(s => updateSimit(s, dt));
  G.simits = G.simits.filter(s => !s.gone);
  updatePassengers(dt);
  updateVendor(dt);

  G.cryTimer -= dt;
  if (G.cryTimer <= 0) { G.cryTimer = rand(2.5, 6); Sound.gull(0.035); }
  G.hornTimer -= dt;
  if (G.hornTimer <= 0) { G.hornTimer = rand(18, 26); Sound.horn(); }

  updateEffects(dt);
  if (G.t >= ROUND) endGame();
}

function spawnGulls(dt) {
  const R = routeOf(G);
  const normal = G.gulls.filter(g => g.kind === 'normal' && g.state === 'fly').length;
  const want = (G.t < 20 ? 3 : G.t < 40 ? 4 : 5) + R.extra;
  G.spawnTimer -= dt;
  if (G.spawnTimer <= 0 && normal < want) {
    G.spawnTimer = rand(0.6, 1.4) / Math.max(0.8, R.speed);
    addGull('normal');
  }
  G.goldTimer -= dt;
  if (G.goldTimer <= 0) {
    G.goldTimer = rand(14, 22);
    addGull('gold');
    addFloat(VW / 2, 200, pick(LINES_GOLD), '#ffd54f', 30);
    Sound.gold();
  }
  G.thiefTimer -= dt;
  if (G.thiefTimer <= 0 && G.t < ROUND - 4) {
    G.thiefTimer = rand(10, 16) - R.extra;
    addGull('thief');
  }
  G.patronTimer -= dt;
  if (G.patronTimer <= 0 && !G.gulls.some(g => g.kind === 'patron')) {
    G.patronTimer = 999;
    addGull('patron');
    addFloat(VW / 2, 168, 'Patron martı!', '#ffe082', 28);
    Sound.gull(0.07);
  }
}

function addGull(kind) {
  const fromLeft = Math.random() < 0.5;
  const spd = routeOf(G).speed || 1;
  const speed = (kind === 'gold' ? rand(190, 230) : rand(85, 155) + G.t * 0.9) * spd;
  const g = {
    kind, state: 'fly', x: fromLeft ? -40 : VW + 40, y: 0,
    vx: (fromLeft ? 1 : -1) * speed, vy: 0,
    baseY: kind === 'gold' ? rand(130, 300) : rand(110, 450),
    amp: rand(10, 35), freq: rand(1, 2.2), phase: rand(0, 6), flap: rand(0, 6),
    flapSpeed: kind === 'gold' ? 16 : rand(9, 13), size: kind === 'gold' ? 1.15 : rand(0.9, 1.1),
    life: 0, carrying: false, bites: 0, need: 1,
  };
  if (kind === 'thief') {
    g.baseY = rand(160, 260);
    g.vx = (fromLeft ? 1 : -1) * 130 * spd;
    g.state = 'cruise';
    g.diveAt = rand(1.2, 2.2);
  }
  if (kind === 'patron') {
    g.size = 1.62;
    g.baseY = rand(150, 250);
    g.vx = (fromLeft ? 1 : -1) * 78 * spd;
    g.state = 'patrol';
    g.need = 3;
    g.stay = 20;
    g.flapSpeed = 8;
    g.amp = 16;
    G.sawPatron = true;
  }
  g.y = g.baseY;
  G.gulls.push(g);
}

function updateGull(g, dt) {
  g.life += dt;
  g.flap += g.flapSpeed * dt;
  const home = (rad, speed) => {
    for (const s of G.simits) {
      const dx = s.x - g.x, dy = s.y - g.y, d = Math.hypot(dx, dy);
      if (d < rad && d > 1) {
        g.x += dx / d * speed * dt;
        g.baseY += dy / d * speed * dt;
      }
    }
  };
  if (g.state === 'fly') {
    g.x += g.vx * dt;
    g.baseY += g.vy * dt;
    g.vy *= Math.pow(0.3, dt);
    g.y = g.baseY + Math.sin(g.life * g.freq + g.phase) * g.amp;
    home(HOMING_R, HOMING_SPEED);
    if ((g.vx > 0 && g.x > VW + 60) || (g.vx < 0 && g.x < -60)) g.gone = true;
  } else if (g.state === 'patrol') {
    g.x += g.vx * dt;
    g.y = g.baseY + Math.sin(g.life * 1.3) * g.amp;
    if (g.x > VW - 36) { g.x = VW - 36; g.vx = -Math.abs(g.vx); }
    if (g.x < 36) { g.x = 36; g.vx = Math.abs(g.vx); }
    home(70, 28);
    g.stay -= dt;
    if (g.stay <= 0) { g.state = 'leave'; g.vy = -160; g.vx = (g.x < VW / 2 ? -1 : 1) * 180; }
  } else if (g.state === 'cruise') {
    g.x += g.vx * dt;
    g.y = g.baseY + Math.sin(g.life * 3) * 10;
    if (g.life > g.diveAt && g.x > 60 && g.x < VW - 60) {
      g.state = 'dive';
      addBubble(g.x, g.y - 30, pick(LINES_THIEF), '#fff3e0');
      Sound.gull(0.07);
    }
    if ((g.vx > 0 && g.x > VW + 60) || (g.vx < 0 && g.x < -60)) g.gone = true;
  } else if (g.state === 'dive') {
    const dx = BASKET.x - g.x, dy = BASKET.y - 30 - g.y, d = Math.hypot(dx, dy) || 1;
    const sp = 210;
    g.vx = dx / d * sp; g.x += g.vx * dt; g.y += dy / d * sp * dt;
    if (d < 20) {
      if (G.stock > 0) {
        G.stock--;
        g.carrying = true;
        addFloat(BASKET.x - 40, BASKET.y - 70, 'Simidini çaldı! -1', '#ff8a80', 22);
        addBubble(g.x, g.y - 40, pick(LINES_THIEF), '#fff3e0');
        Sound.steal();
        G.shake = 6;
      }
      g.state = 'leave'; g.vx = (g.x < VW / 2 ? -1 : 1) * 220; g.vy = -260;
    }
  } else if (g.state === 'leave' || g.state === 'fed' || g.state === 'flee') {
    g.x += g.vx * dt; g.y += g.vy * dt;
    if (g.y < -80 || g.x < -80 || g.x > VW + 80) g.gone = true;
  }
}

function updateSimit(s, dt) {
  s.vx += (G.wind || 0) * dt;
  s.vy += GRAVITY * dt;
  s.x += s.vx * dt; s.y += s.vy * dt;
  s.rot += s.spin * dt;
  s.age += dt;
  if (Math.random() < 0.3) G.crumbs.push(crumb(s.x, s.y, 0.4));

  for (const g of G.gulls) {
    if (g.state === 'leave' || g.state === 'fed' || g.state === 'flee') continue;
    const r = CATCH_R * g.size;
    if (Math.hypot(s.x - g.x, s.y - g.y) < r) {
      s.gone = true;
      if (g.kind === 'thief') hitThief(g);
      else feedGull(g);
      return;
    }
  }

function throwSimit(vx, vy) {
  if (G.mode !== 'play' || G.stock <= 0) return false;
  const sp = Math.hypot(vx, vy);
  if (sp > MAX_SPEED) { vx *= MAX_SPEED / sp; vy *= MAX_SPEED / sp; }
  G.stock--; G.thrown++;
  G.handCooldown = 0.22;
  G.simits.push({ x: HAND.x, y: HAND.y - 6, vx, vy, rot: 0, spin: rand(8, 14) * (vx < 0 ? -1 : 1), age: 0 });
  Sound.throw();
  return true;
}

// Elden ekranın görünen alt kenarına kadar olan mesafe (mantıksal piksel).
function roomBelowHand(w, h) {
  const s = Math.min(w / VW, h / VH);
  const oy = (h - VH * s) / 2;
  return (h - oy) / s - HAND.y;
}
// 390×844 portrede tam aşağı çekiş. Masaüstünde oyun yüksekliğe sığar,
// el neredeyse alt kenardadır; aynı jest çok kısa kalır. Çarpan o jesti
// bu çekişe uzatır. Telefon bu ölçüde olduğundan çarpan 1'dir, hissi değişmez.
const REF_PULL = roomBelowHand(390, 844);

function pullScale() {
  const w = view.w || 1, h = view.h || 1;
  // Telefonda oyun genişliğe sığar; alttaki boşluk çekişi zaten uzatır.
  // Yalnızca yüksekliğe sığan görünümde (masaüstü) aynı jesti telefona eşitle.
  if (h / VH > w / VW) return 1;
  const room = roomBelowHand(w, h);
  if (!(room > 1) || room >= REF_PULL) return 1;
  return REF_PULL / room;
}

function dragVelocity(d) {
  const scale = pullScale();
  const dx = (d.x0 - d.x) * scale, dy = (d.y0 - d.y) * scale;
  let vx = dx * PULL_K, vy = dy * PULL_K;
  const sp = Math.hypot(vx, vy);
  if (sp > MAX_SPEED) { vx *= MAX_SPEED / sp; vy *= MAX_SPEED / sp; }
  return { vx, vy, pull: Math.hypot(dx, dy) };
}

function crumb(x, y, power, gold) {
  return {
    x, y, vx: rand(-120, 120) * power, vy: rand(-160, 40) * power, life: rand(0.4, 0.9),
    col: gold ? pick(['#ffd54f', '#fff59d', '#ffecb3']) : pick(['#c68642', '#a0522d', '#fff8e1', '#f5deb3']),
    r: rand(1.2, 3),
  };
}
function addFloat(x, y, text, col, size) { G.floats.push({ x, y, text, col, size: size || 22, life: 1.3 }); }
function addBubble(x, y, text, bg, force, life) {
  if (!force && G.bubbles.length >= 3) return;
  G.bubbles.push({ x, y, text, bg: bg || '#ffffff', life: life || 2, max: life || 2 });
}
function updateEffects(dt) {
  G.crumbs.forEach(c => { c.life -= dt; c.x += c.vx * dt; c.y += c.vy * dt; c.vy += 500 * dt; });
  G.crumbs = G.crumbs.filter(c => c.life > 0);
  G.floats.forEach(f => { f.life -= dt; f.y -= 40 * dt; });
  G.floats = G.floats.filter(f => f.life > 0);
  G.bubbles.forEach(b => b.life -= dt);
  G.bubbles = G.bubbles.filter(b => b.life > 0);
  G.shake *= Math.pow(0.01, dt);
}

function armRound(route, daily) {
  if (daily) {
    meta.daily = true;
    meta.cond = rollDay(dateKey());
    meta.route = meta.cond.route;
  } else {
    if (route > unlocked()) {
      meta.note = ROUTES[route - 1].goal + ' puanla sıradaki hat açılır';
      meta.noteT = 2.6;
      return false;
    }
    meta.daily = false;
    meta.route = route;
    meta.cond = rollFree(route);
  }
  return true;
}
function startGame() {

  newGame();
  if (manual) G.manual = true;
  G.mode = 'play';
  Sound.init();
  Sound.horn();
  setTimeout(() => Sound.gull(0.06), 600);
}

function endGame() {
  if (G.mode === 'end') return;
  G.mode = 'end';
  G.endAt = performance.now();
  G.prevBest = bestScore();
  G.record = G.score > G.prevBest;
  if (G.record) store('simit_best', String(G.score));
  if (G.daily && G.cond && G.cond.date) {
    G.dailyRecord = saveDaily(G.cond.date, G.score);
    G.dailyBest = dailyBest(G.cond.date);
  }
  const R = routeOf(G);
  G.justUnlocked = false;
  if (R.goal && G.score >= R.goal && G.route < ROUTES.length - 1) {
    const before = unlocked();
    setUnlocked(G.route + 1);
    G.justUnlocked = unlocked() > before;
  }
  G.drag = null;
  Sound.horn();
}

function dataURLToBlob(dataURL) {

  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

function drawShareSimit(g, x, y, sc) {
  g.save(); g.translate(x, y); g.scale(sc, sc);
  g.strokeStyle = '#8d4a1d'; g.lineWidth = 10;
  g.beginPath(); g.arc(0, 0, 36, 0, Math.PI * 2); g.stroke();
  g.strokeStyle = '#e0a15a'; g.lineWidth = 6;
  g.beginPath(); g.arc(0, 0, 36, 0, Math.PI * 2); g.stroke();
  g.fillStyle = '#fff6df';
  for (let k = 0; k < 10; k++) { const a = k * 0.62; g.fillRect(Math.cos(a) * 36 - 2, Math.sin(a) * 36 - 2, 4, 3); }
  g.restore();
}
function roundPath(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function fallbackDownload(pack) {
  const a = document.createElement('a');
  a.href = pack.dataUrl;
  a.download = 'martilara-simit.png';
  document.body.appendChild(a);
  a.click();
  a.remove();
  let copied = false;
  const done = (ok) => {
    copied = ok;
    if (G) G.shareNote = ok ? 'Görsel indirildi, yazı kopyalandı' : 'Görsel indirildi';
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(pack.text).then(() => done(true)).catch(() => done(false));
  } else done(false);
  return copied;
}
function shareScore() {
  let pack;
  try { pack = prepareShare(); }
  catch (e) { if (G) G.shareNote = 'Kart hazırlanamadı'; return 'error'; }
  const file = new File([pack.blob], 'martilara-simit.png', { type: 'image/png' });
  const payload = { files: [file], text: pack.text, title: 'Martılara Simit At', url: GAME_URL };
  let can = false;
  try { can = !!(navigator.share && (typeof navigator.canShare !== 'function' || navigator.canShare(payload))); }
  catch (e) { can = false; }
  if (can) {
    navigator.share(payload).then(() => { if (G) G.shareNote = 'Paylaşıldı'; }).catch(err => {
      if (err && err.name === 'AbortError') { if (G) G.shareNote = ''; return; }
      fallbackDownload(pack);
    });
    return 'share';
  }
  fallbackDownload(pack);
  return 'download';
}

function drawSimit(x, y, sc, rot) {

function drawDeck() {
  ctx.fillStyle = '#e9edf2';

function drawPassenger(p) {
  const bob = Math.sin(T * 2 + p.x) * 1.5;
  const scare = p.role === 'child' && p.scare > 0;
  const wave = p.hungry > 0 && !scare;
  ctx.save();
  if (p.role === 'child') {
    ctx.translate(p.x, PASSENGER_HEAD_Y + 20);
    ctx.scale(0.74, 0.74);
    ctx.translate(-p.x, -(PASSENGER_HEAD_Y + 20));
  }
  const x = p.x + (p.hit > 0 ? Math.sin(T * 50) * 3 : 0);
  const y = PASSENGER_HEAD_Y + bob + (scare ? 16 : 0);
  ctx.fillStyle = p.col;
  roundRect(x - 20, y + 16, 40, scare ? 40 : 60, 12); ctx.fill();
  ctx.strokeStyle = p.col; ctx.lineWidth = 8; ctx.lineCap = 'round';
  if (scare) {
    ctx.beginPath(); ctx.moveTo(x - 14, y + 24); ctx.lineTo(x - 26, y + 8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 14, y + 24); ctx.lineTo(x + 26, y + 8); ctx.stroke();
  } else if (p.role === 'tourist') {
    ctx.beginPath(); ctx.moveTo(x - 16, y + 26); ctx.lineTo(x - 28, y + 8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 16, y + 26); ctx.lineTo(x + 8, y - 8); ctx.stroke();
    ctx.fillStyle = '#263238'; roundRect(x - 2, y - 28, 16, 24, 3); ctx.fill();
    ctx.fillStyle = '#b3e5fc'; ctx.fillRect(x, y - 25, 12, 16);
    if (Math.sin(T * 8) > 0.85) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + 6, y - 16, 6, 0, 7); ctx.fill(); }
  } else {
    ctx.beginPath(); ctx.moveTo(x - 16, y + 26); ctx.lineTo(x - 24, y + 56); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 16, y + 26);
    if (wave) ctx.lineTo(x + 30 + Math.sin(T * 12) * 8, y - 8);
    else if (p.eat > 0) ctx.lineTo(x + 8, y + 6);
    else ctx.lineTo(x + 24, y + 56);
    ctx.stroke();
    if (wave) { ctx.fillStyle = '#ffcc99'; ctx.beginPath(); ctx.arc(x + 30 + Math.sin(T * 12) * 8, y - 12, 5, 0, 7); ctx.fill(); }
  }
  ctx.fillStyle = p.hit > 0 ? '#ff8a80' : '#ffcc99';
  ctx.beginPath(); ctx.arc(x, y, 15, 0, 7); ctx.fill();
  ctx.fillStyle = p.hair;
  ctx.beginPath(); ctx.arc(x, y - 3, 15, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();
  if (p.hat) { ctx.fillStyle = '#37474f'; ctx.fillRect(x - 15, y - 15, 30, 5); ctx.fillRect(x - 10, y - 24, 20, 10); }
  if (p.role === 'tourist') {
    ctx.strokeStyle = '#263238'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x - 5, y - 2, 4, 0, 7); ctx.arc(x + 5, y - 2, 4, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 8, y - 2); ctx.lineTo(x + 8, y - 2); ctx.stroke();
  }
  ctx.fillStyle = '#3e2723';
  if (p.hit > 0 || scare) {
    ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(scare ? 'o  o' : 'x  x', x, y + 1);
    ctx.beginPath(); ctx.arc(x, y + 7, 3, 0, 7); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(x - 5, y - 1, 1.6, 0, 7); ctx.arc(x + 5, y - 1, 1.6, 0, 7); ctx.fill();
    ctx.strokeStyle = '#3e2723'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (wave || p.role === 'tourist') ctx.arc(x, y + 6, 4, 0.15 * Math.PI, 0.85 * Math.PI);
    else ctx.arc(x, y + 4, 4, 0.2 * Math.PI, 0.8 * Math.PI);
    ctx.stroke();
  }
  if (p.eat > 0) drawSimit(x + 8, y + 8, 0.55, T * 2);
  if (wave) {
    ctx.fillStyle = '#ffeb3b'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('!', x, y - 26 + Math.sin(T * 8) * 3);
  }
  ctx.restore();
}

function drawVendor(v) {

function drawHand() {
  let ox = 0, oy = 0;
  if (G.drag && G.mode === 'play') {
    const dx = G.drag.x - G.drag.x0, dy = G.drag.y - G.drag.y0, d = Math.hypot(dx, dy) || 1;
    const eff = d * pullScale();
    const m = Math.min(eff, 260) / 260 * 55;
    ox = dx / d * m; oy = dy / d * m;
  } else if (G.handCooldown > 0) oy = -G.handCooldown * 60;
  const x = HAND.x + ox, y = HAND.y + oy;
  ctx.fillStyle = '#ffcc99';
  ctx.beginPath(); ctx.moveTo(x - 18, y + 10); ctx.lineTo(x + 18, y + 10); ctx.lineTo(HAND.x + 26, VH + 300); ctx.lineTo(HAND.x - 26, VH + 300); ctx.fill();
  ctx.fillStyle = '#1565c0';
  ctx.beginPath(); ctx.moveTo(HAND.x - 30, VH - 30); ctx.lineTo(HAND.x + 30, VH - 30); ctx.lineTo(HAND.x + 34, VH + 300); ctx.lineTo(HAND.x - 34, VH + 300); ctx.fill();
  ctx.fillStyle = '#ffcc99';
  ctx.beginPath(); ctx.ellipse(x, y + 8, 22, 16, 0, 0, Math.PI * 2); ctx.fill();
  if (G.stock > 0 && G.handCooldown <= 0 && G.mode !== 'end') drawSimit(x, y - 6, 1, 0);
  ctx.fillStyle = '#f5b98a';
  ctx.beginPath(); ctx.ellipse(x - 18, y, 6, 11, -0.4, 0, Math.PI * 2); ctx.fill();
  for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.ellipse(x - 8 + k * 9, y + 16, 5, 7, 0, 0, Math.PI * 2); ctx.fill(); }
}

function drawAim() {
  const d = G.drag, v = dragVelocity(d);
  ctx.strokeStyle = '#ffffff55'; ctx.lineWidth = 3; ctx.setLineDash([4, 6]);
  ctx.beginPath(); ctx.moveTo(d.x0, d.y0); ctx.lineTo(d.x, d.y); ctx.stroke(); ctx.setLineDash([]);
  if (v.pull < MIN_PULL || v.vy >= 0) return;
  const power = Math.hypot(v.vx, v.vy) / MAX_SPEED;
  for (let k = 1; k <= 7; k++) {
    const t = k * 0.05;
    const x = HAND.x + v.vx * t + 0.5 * (G.wind || 0) * t * t;
    const y = HAND.y - 6 + v.vy * t + 0.5 * GRAVITY * t * t;
    ctx.fillStyle = 'rgba(255,255,255,' + (0.9 - k * 0.11) + ')';
    ctx.beginPath(); ctx.arc(x, y, 5 - k * 0.45, 0, 7); ctx.fill();
  }
  ctx.fillStyle = '#00000055'; roundRect(HAND.x - 40, HAND.y + 40, 80, 8, 4); ctx.fill();
  ctx.fillStyle = power > 0.9 ? '#ff7043' : '#ffe082'; roundRect(HAND.x - 40, HAND.y + 40, 80 * power, 8, 4); ctx.fill();
}

function drawEffects() {
  G.crumbs.forEach(c => { ctx.globalAlpha = Math.min(1, c.life * 2); ctx.fillStyle = c.col; ctx.fillRect(c.x, c.y, c.r, c.r); });
  ctx.globalAlpha = 1;
  G.bubbles.forEach(drawBubble);
  G.floats.forEach(f => {
    ctx.globalAlpha = Math.min(1, f.life * 2);
    const pop = 1 + Math.max(0, f.life - 1.1) * 2;
    ctx.font = '900 ' + Math.round(f.size * pop) + 'px system-ui, sans-serif'; ctx.textAlign = 'center';
    const w = ctx.measureText(f.text).width, x = clamp(f.x, w / 2 + 6, VW - w / 2 - 6);
    ctx.lineWidth = 5; ctx.strokeStyle = '#2b1d4e'; ctx.strokeText(f.text, x, f.y);
    ctx.fillStyle = f.col; ctx.fillText(f.text, x, f.y);
  });
  ctx.globalAlpha = 1;
}

function drawBubble(b) {
  const age = b.max - b.life, sc = Math.min(1, age * 7);
  ctx.globalAlpha = Math.min(1, b.life * 3);
  ctx.font = 'bold 16px system-ui, sans-serif';
  const w = Math.min(ctx.measureText(b.text).width + 20, 280), h = 30;
  const bx = clamp(b.x - w / 2, 6, VW - w - 6), by = clamp(b.y - h - 12, 70, VH - h - 80);
  ctx.save();
  ctx.translate(b.x, b.y); ctx.scale(sc, sc); ctx.translate(-b.x, -b.y);
  ctx.fillStyle = b.bg; ctx.strokeStyle = '#2b1d4e'; ctx.lineWidth = 2;
  roundRect(bx, by, w, h, 14); ctx.fill(); ctx.stroke();
  const tx = clamp(b.x, bx + 14, bx + w - 14);
  ctx.beginPath(); ctx.moveTo(tx - 6, by + h - 1); ctx.lineTo(tx, by + h + 10); ctx.lineTo(tx + 6, by + h - 1); ctx.fill();
  ctx.fillStyle = '#2b1d4e'; ctx.textAlign = 'center'; ctx.fillText(b.text, bx + w / 2, by + 20);
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawHud() {

  ctx.fillText(left + ' sn', 150, 38);

  ctx.fillStyle = '#ffffffcc';
  ctx.beginPath(); ctx.moveTo(s.x + 3, s.y + 11); ctx.lineTo(s.x + 9, s.y + 11); ctx.lineTo(s.x + 16, s.y + 5);
  ctx.lineTo(s.x + 16, s.y + 25); ctx.lineTo(s.x + 9, s.y + 19); ctx.lineTo(s.x + 3, s.y + 19); ctx.fill();

  else { ctx.beginPath(); ctx.arc(s.x + 16, s.y + 15, 6, -0.8, 0.8); ctx.stroke(); ctx.beginPath(); ctx.arc(s.x + 16, s.y + 15, 11, -0.8, 0.8); ctx.stroke(); }

function card(h) {
  ctx.fillStyle = '#1a1026aa'; ctx.fillRect(-40, -2000, VW + 80, VH + 4000);
  const y = (VH - h) / 2;
  ctx.fillStyle = '#fffaf0'; roundRect(36, y, VW - 72, h, 26); ctx.fill();
  ctx.strokeStyle = '#c62828'; ctx.lineWidth = 6; roundRect(36, y, VW - 72, h, 26); ctx.stroke();
  return y;
}
function textAt(t, x, y, size, col, weight) {
  ctx.font = (weight || 800) + ' ' + size + 'px system-ui, sans-serif';
  ctx.fillStyle = col || '#2b1d4e'; ctx.textAlign = 'center'; ctx.fillText(t, x, y);
}
function fitText(t, x, y, size, col, weight, maxW) {
  let s = size;
  do {
    ctx.font = (weight || 800) + ' ' + s + 'px system-ui, sans-serif';
    if (ctx.measureText(t).width <= maxW || s <= 12) break;
    s -= 1;
  } while (s > 12);
  ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.fillText(t, x, y);
}
function uiButton(b, label, sub, kind) {
  const locked = kind === 'locked', primary = kind === 'primary', daily = kind === 'daily';
  ctx.fillStyle = locked ? '#efe6da' : primary ? '#c62828' : daily ? '#e65100' : '#fffaf3';
  roundRect(b.x, b.y, b.w, b.h, 18); ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = locked ? '#d9cbb8' : primary ? '#7f1212' : daily ? '#bf360c' : '#efd3b0';
  roundRect(b.x, b.y, b.w, b.h, 18); ctx.stroke();
  const col = locked ? '#9a8878' : (primary || daily) ? '#fff' : '#2b1d4e';
  const subCol = locked ? '#9a8878' : (primary || daily) ? '#ffe0b2' : '#6d4c41';
  fitText(label, b.x + b.w / 2, b.y + (sub ? 34 : b.h / 2 + 8), 22, col, 800, b.w - 24);
  if (sub) fitText(sub, b.x + b.w / 2, b.y + 58, 15, subCol, 600, b.w - 24);
}

function roundRect(x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* =========================================================
   ANA DÖNGÜ
   ========================================================= */

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  T += dt;
  if (meta.noteT > 0) meta.noteT -= dt;
  if (!G.manual) step(dt);
  if (G.mode === 'start' || G.mode === 'end') {
    G.gulls.forEach(g => updateGull(g, dt));
    G.gulls = G.gulls.filter(g => !g.gone);
    if (G.gulls.length < 3) addGull('normal');
  }
  if (G.mode !== 'play') updateEffects(dt * 0.5);
  render();
  requestAnimationFrame(frame);
}

newGame();
for (let k = 0; k < 3; k++) { addGull('normal'); G.gulls[k].x = 90 + k * 160; }
resize();
requestAnimationFrame(frame);

window.sg = {
  get G() { return G; },
  get meta() { return meta; },
  step, startGame, startRoute, endGame, goMenu, throwSimit, toLogical,
  get view() { return view; },
  HAND, GRAVITY, MAX_SPEED, PULL_K, ROUND, ROUTES, TIMES, GAME_URL,
  rollDay, dateKey, shareScore, prepareShare, unlocked, windWord,
};
