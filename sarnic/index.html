<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#241c16">
<meta name="description" content="Sarnıç. İstanbul hikâyesi. Ocak 1955.">
<title>Sarnıç</title>
<style>
  @font-face {
    font-family: "Lora";
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url("fonts/lora-latin-ext-400.woff2") format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: "Lora";
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url("fonts/lora-latin-400.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Lora";
    font-style: normal;
    font-weight: 600;
    font-display: swap;
    src: url("fonts/lora-latin-ext-600.woff2") format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: "Lora";
    font-style: normal;
    font-weight: 600;
    font-display: swap;
    src: url("fonts/lora-latin-600.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  :root {
    --ink: #2c241c;
    --fade: #6e5b48;
    --rule: rgba(44, 36, 28, 0.28);
    --cream: #f3ecdf;
    --sheet: #e6d5b8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--sheet);
  }
  body {
    color: var(--ink);
    font-family: Lora, "Liberation Serif", "Noto Serif", Georgia, serif;
    font-size: 17px;
    line-height: 1.45;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #grain {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
    opacity: 0.18;
  }
  #plate {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 50%;
    width: min(100vw, 440px);
    transform: translateX(-50%);
    background: var(--sheet);
    z-index: 0;
  }
  #plate img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center top;
  }
  #plate .veil {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 58%;
    pointer-events: none;
    opacity: 0;
    background: linear-gradient(
      to bottom,
      rgba(243, 236, 223, 0) 0%,
      rgba(243, 236, 223, 0.18) 22%,
      rgba(243, 236, 223, 0.72) 48%,
      rgba(243, 236, 223, 0.94) 70%,
      var(--cream) 100%
    );
  }
  body.reading #plate .veil { opacity: 1; }
  header {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: min(100vw, 440px);
    z-index: 4;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: calc(8px + env(safe-area-inset-top)) 16px 0;
    color: #f6efe4;
    text-shadow: 0 1px 2px rgba(28, 20, 12, 0.55);
    pointer-events: none;
  }
  body.bare header { visibility: hidden; }
  .brand {
    font-size: 15px;
    letter-spacing: 0.18em;
    font-variant: small-caps;
    padding: 8px 0;
  }
  .spacer { flex: 1; }
  header button, #ask button, #end button, button.choice {
    font-family: inherit;
    color: inherit;
    background: transparent;
    border: 0;
    cursor: pointer;
  }
  header button {
    pointer-events: auto;
    color: #f6efe4;
    font-size: 15px;
    padding: 8px 2px;
  }
  header button[aria-pressed="true"] { font-weight: 600; }
  #hit {
    position: fixed;
    inset: 0;
    z-index: 2;
    border: 0;
    padding: 0;
    background: transparent;
    cursor: pointer;
  }
  #sheet {
    position: fixed;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: min(100vw, 440px);
    z-index: 3;
    max-height: calc(100dvh - 56px - env(safe-area-inset-top));
    overflow-y: auto;
    padding: 8px 22px calc(18px + env(safe-area-inset-bottom));
    color: var(--ink);
    font-size: 17px;
    line-height: 1.45;
  }
  #prose { margin: 0; font-size: 17px; font-weight: 400; }
  #choices {
    display: flex;
    flex-direction: column;
    margin-top: 14px;
    border-top: 1px solid var(--rule);
  }
  button.choice {
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 48px;
    padding: 11px 0;
    text-align: left;
    font-size: 17px;
    line-height: 1.35;
    color: var(--ink);
    border-bottom: 1px solid var(--rule);
  }
  button.choice::before {
    content: "–";
    margin-right: 10px;
    color: var(--fade);
  }
  #ask p, #endline {
    margin: 0 0 8px;
  }
  #endline {
    font-size: 22px;
    font-weight: 600;
    line-height: 1.3;
  }
  #ask button, #end button {
    display: block;
    width: 100%;
    min-height: 48px;
    padding: 12px 0;
    text-align: center;
    font-size: 17px;
    letter-spacing: 0.06em;
    font-variant: small-caps;
    color: var(--ink);
    border-top: 1px solid var(--ink);
  }
  #toast {
    min-height: 1.2em;
    margin: 8px 0 0;
    text-align: center;
    color: var(--fade);
    font-size: 15px;
  }
  #toast:empty { display: none; }
  @media (hover: hover) {
    button.choice:hover, #ask button:hover, #end button:hover { color: #7a342c; }
  }
  :focus-visible { outline: 1px solid #7a342c; outline-offset: 3px; }
</style>
</head>
<body>
<canvas id="grain" aria-hidden="true"></canvas>
<div id="plate" aria-hidden="true">
  <img id="plate-img" alt="">
  <div class="veil"></div>
</div>
<header>
  <div class="brand">Sarnıç</div>
  <div class="spacer"></div>
  <button type="button" id="snd">ses</button>
  <button type="button" id="restart">baştan</button>
</header>
<button type="button" id="hit" aria-label="Devam"></button>
<div id="sheet" hidden>
  <p id="prose"></p>
  <div id="choices"></div>
  <div id="ask" hidden>
    <p>Baştan başlansın mı?</p>
    <button type="button" id="yes">Evet</button>
    <button type="button" id="no">Vazgeç</button>
  </div>
  <div id="end" hidden>
    <p id="endline"></p>
    <button type="button" id="again">Baştan başla</button>
    <button type="button" id="share">Paylaş</button>
    <p id="toast" role="status"></p>
  </div>
</div>
<script src="engine.js"></script>
<script src="stories/martili-saat.js"></script>
<script>Sarnic.boot();</script>
</body>
</html>
