<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e6d5b8">
<meta name="description" content="Sarnıç. Haftalık İstanbul hikâyesi. İlk hikâye: Martılı Saat (Kış 1955).">
<title>Sarnıç</title>
<!--
  Görünüm motorun parçasıdır. Yeni hikâye bu dosyaya sahne yazmaz;
  yalnızca aşağıdaki script listesine bir satır ekler. Ayrıntı README'de.
-->
<style>
  :root {
    --ink: #2c241c;
    --fade: #6e5b48;
    --rule: rgba(44, 36, 28, 0.28);
    --paper: #f3ecdf;
    --sheet: #e6d5b8;
    --red: #7a342c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    color: var(--ink);
    font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, "Liberation Serif", "Noto Serif", "Times New Roman", serif;
    font-size: 18px;
    line-height: 1.55;
    background: var(--sheet);
    -webkit-tap-highlight-color: transparent;
  }
  #grain {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0; opacity: 0.55;
  }
  #app {
    position: relative; z-index: 1;
    max-width: 440px;
    margin: 0 auto;
    min-height: 100dvh;
    padding: calc(20px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));
  }
  header {
    display: flex; align-items: baseline; gap: 8px;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--rule);
  }
  header .title {
    font-weight: 600; letter-spacing: 0.2em; font-variant: small-caps;
    font-size: 16px; background: none; border: 0; color: inherit;
    padding: 8px 0 10px; cursor: pointer; font-family: inherit;
  }
  header .spacer { flex: 1; }
  header button {
    font-family: inherit; color: var(--fade); background: transparent;
    border: 0; font-size: 15px; font-style: italic;
    padding: 8px 4px 10px; cursor: pointer;
  }
  header button[aria-pressed="true"] { color: var(--ink); font-style: normal; }
  #plate {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 0;
  }
  #plate.on { display: block; }
  #plate img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
  }
  #plate .veil {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(48, 32, 18, 0.5), rgba(28, 18, 12, 0.78));
  }
  body.photo {
    --ink: #f6efe4;
    --fade: rgba(246, 239, 228, 0.74);
    --rule: rgba(246, 239, 228, 0.32);
    --red: #f0c7bc;
    background: #1a120c;
  }
  body.photo #grain { opacity: 0.12; }
  body.photo .card { background: transparent; border-color: transparent; }
  .card {
    background: var(--paper);
    border: 1px solid var(--rule);
    padding: 22px 22px 18px;
  }
  .kicker {
    font-size: 13px; letter-spacing: 0.16em; font-variant: small-caps;
    color: var(--fade); margin: 0 0 8px;
  }
  h1 {
    font-size: 40px; font-weight: 500; margin: 0 0 6px;
    letter-spacing: 0.01em; line-height: 1.05;
  }
  h2 { font-size: 22px; margin: 0 0 12px; font-weight: 500; letter-spacing: 0; }
  .card h2:not(.endname) { font-style: italic; }
  .prose { margin: 0 0 6px; white-space: pre-wrap; }
  .prose.caret::after {
    content: "";
    display: inline-block;
    width: 0.45em; height: 0.9em;
    margin-left: 2px;
    vertical-align: -0.05em;
    background: var(--ink);
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .prose.caret::after { animation: none; }
  }
  .hint {
    margin: 0 0 4px; color: var(--fade); font-size: 13px; font-style: italic;
  }
  .choices {
    display: flex; flex-direction: column;
    margin: 18px 0 4px;
    border-top: 1px solid var(--rule);
  }
  button.choice, button.primary, a.xl {
    display: flex; align-items: center;
    width: 100%; min-height: 56px;
    padding: 14px 0;
    font-family: inherit; font-size: 17.5px; line-height: 1.35;
    text-align: left; text-decoration: none;
    color: var(--ink); background: transparent;
    border: 0; border-bottom: 1px solid var(--rule);
    cursor: pointer;
  }
  button.choice::before {
    content: "–";
    margin-right: 12px;
    color: var(--fade);
  }
  button.primary {
    justify-content: center;
    margin-top: 18px;
    border-top: 1px solid var(--ink);
    border-bottom: 1px solid var(--ink);
    letter-spacing: 0.08em;
    font-variant: small-caps;
    font-size: 18px;
  }
  a.xl {
    justify-content: center;
    border: 0;
    color: var(--fade);
    font-style: italic;
    min-height: 48px;
  }
  .found { color: var(--fade); font-size: 15px; font-style: italic; margin: 14px 0 4px; }
  .endname {
    font-size: 32px; font-weight: 500; font-style: italic;
    margin: 0 0 10px; color: var(--red); letter-spacing: 0;
  }
  .shelf { margin-top: 36px; }
  .shelf h2 {
    font-size: 13px; font-style: normal; font-weight: 500;
    letter-spacing: 0.16em; font-variant: small-caps;
    color: var(--fade); margin: 0 0 8px;
  }
  .empty {
    padding: 8px 0 0; color: var(--fade); font-size: 16px;
    font-style: italic; margin: 0;
  }
  .past {
    width: 100%; text-align: left; font-family: inherit; font-size: 18px;
    font-style: italic; background: transparent; border: 0;
    border-bottom: 1px solid var(--rule);
    padding: 14px 0; margin: 0; cursor: pointer; color: inherit;
  }
  .ask {
    display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap;
    margin: 0 0 14px; color: var(--fade); font-size: 15px; font-style: italic;
  }
  .ask button {
    font-family: inherit; font-size: 16px; font-style: normal;
    min-height: 44px; padding: 8px 0; background: transparent;
    border: 0; border-bottom: 1px solid var(--ink); color: var(--ink); cursor: pointer;
  }
  @media (min-width: 900px) {
    #app { padding-top: 40px; }
    h1 { font-size: 46px; }
  }
  @media (hover: hover) {
    button.choice:hover, .past:hover { color: var(--red); }
    button.primary:hover, a.xl:hover { color: var(--red); }
  }
  :focus-visible { outline: 1px solid var(--red); outline-offset: 3px; }
</style>
</head>
<body>
<canvas id="grain" aria-hidden="true"></canvas>
<div id="plate" aria-hidden="true">
  <img id="plate-img" alt="">
  <div class="veil"></div>
</div>
<div id="app"></div>
<script src="engine.js"></script>
<script src="stories/martili-saat.js"></script>
<!-- Yeni hikâye script'i bu satırın üstüne. -->
<script>Sarnic.boot();</script>
</body>
</html>
