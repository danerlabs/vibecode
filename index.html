<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a1026">
<title>Vibecode</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #1a1026;
    color: #f6efe4;
  }
  main {
    max-width: 28rem;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 3rem;
  }
  h1 {
    font-size: 1.6rem;
    font-weight: 650;
    margin: 0 0 0.35rem;
  }
  p {
    margin: 0 0 1.5rem;
    color: #d8cbb8;
    line-height: 1.45;
  }
  a.game {
    display: block;
    text-decoration: none;
    color: inherit;
    background: #2a1c3d;
    border: 1px solid #4a3568;
    border-radius: 14px;
    padding: 1rem 1.1rem;
  }
  a.game strong {
    display: block;
    font-size: 1.15rem;
    margin-bottom: 0.25rem;
  }
  a.game span {
    color: #cbb89a;
    font-size: 0.95rem;
  }
</style>
</head>
<body>
<main>
  <h1>Vibecode</h1>
  <p>Telefonda oynanabilen küçük oyunlar.</p>
  <a class="game" href="martilara-simit/">
    <strong>Martılara Simit At</strong>
    <span>Vapurda martılara simit at.</span>
  </a>
</main>
</body>
</html>
